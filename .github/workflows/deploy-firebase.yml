name: Deploy to Firebase Hosting (Media-Preserving)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: firebase-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Firebase Hosting (preserving /cards/** and /media/**)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEPLOY_MESSAGE: "GitHub Actions deploy: ${{ github.sha }}"
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ℹ️ FIREBASE_SERVICE_ACCOUNT secret not configured yet; skipping automatic Firebase deploy (build verified)."
            exit 0
          fi
          node scripts/deploy_remote_preserving_media.mjs
