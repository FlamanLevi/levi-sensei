    // --- GAME 3: TIME-BOMB PASS ---
    function TimeBombGame({ unit, defaultTier = 'picture_word', lang = 'en', onBack }) {
      const [gameState, setGameState] = useState('ready');
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [fuseTime, setFuseTime] = useState(20);
      const [passCount, setPassCount] = useState(0);
      const timerRef = useRef(null);
      const cards = unit.cards || [];

      const startBomb = () => {
        playSoundEffect('bell');
        setPassCount(0);
        setCurrentCardIndex(0);
        setFuseTime(Math.floor(Math.random() * 16) + 15);
        setGameState('ticking');
      };

      useEffect(() => {
        if (gameState === 'ticking') {
          timerRef.current = setInterval(() => {
            setFuseTime((prev) => {
              playSoundEffect('pop');
              if (prev <= 1) {
                clearInterval(timerRef.current);
                playSoundEffect('wrong');
                setGameState('exploded');
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timerRef.current);
      }, [gameState]);

      const handlePass = () => {
        if (gameState !== 'ticking') return;
        playSoundEffect('flip');
        setPassCount(c => c + 1);
        setCurrentCardIndex(prev => (prev + 1) % cards.length);
      };

      const card = cards[currentCardIndex] || { en: 'Ready', ja: '準備' };

      return (
        <div className="w-full max-w-[1600px] mx-auto flex-1 flex flex-col justify-between space-y-3 sm:space-y-4 md:space-y-5">
          <div className="flex items-center justify-between bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl shadow border-2 border-rose-200 dark:border-slate-700">
            <button onClick={onBack} className="text-gray-500 dark:text-slate-400 hover:text-rose-700 dark:hover:text-rose-300 font-bold text-xs sm:text-sm px-2.5 py-1 rounded-lg">
              {lang === 'ja' ? '← もどる' : '← Back'}
            </button>
            <h2 className="text-xl sm:text-2xl font-black text-rose-800 dark:text-rose-300">
              {lang === 'ja' ? '💣 ばくだん ゲーム' : '💣 Time-Bomb Pass'}
            </h2>
            <span className="text-xs sm:text-sm font-black text-rose-700 dark:text-rose-300 bg-rose-50 dark:bg-rose-950/60 px-3 py-1 rounded-xl border border-rose-200 dark:border-rose-800">
              {lang === 'ja' ? 'パス回数' : 'Passes'}: {passCount}
            </span>
          </div>

          <div className={`p-6 sm:p-8 md:p-10 rounded-3xl border-4 text-center transition-all min-h-[440px] sm:min-h-[520px] md:min-h-[580px] flex flex-col items-center justify-center ${
            gameState === 'exploded' ? 'bg-rose-600 border-yellow-400 text-white' : 'bg-white dark:bg-slate-800 border-rose-300 dark:border-slate-700 shadow-lg'
          }`}>
            {gameState === 'ready' && (
              <div className="space-y-4 max-w-lg">
                <div className="text-7xl sm:text-8xl animate-bounce">💣</div>
                <h3 className="text-2xl sm:text-4xl font-black text-rose-900 dark:text-rose-300">
                  {lang === 'ja' ? 'クラスみんなで 爆弾ゲーム！' : 'Classroom Time-Bomb!'}
                </h3>
                <p className="text-sm sm:text-base text-gray-600 dark:text-slate-300">
                  {lang === 'ja'
                    ? 'じゅんばんに 英語を 言って、PASS ボタンを おしてね！ いつ 爆発するかは だれも わかりません！'
                    : 'Take turns around the class! Say the English word on screen, then press PASS! Nobody knows when the fuse will run out!'}
                </p>
                <button
                  onClick={startBomb}
                  className="px-8 sm:px-10 py-3.5 sm:py-4 bg-rose-600 hover:bg-rose-700 text-white font-black text-xl sm:text-2xl rounded-2xl shadow-xl transition transform hover:scale-105 active:scale-95"
                >
                  {lang === 'ja' ? '🔥 導火線に 火をつける！ (スタート)' : '🔥 LIGHT THE FUSE!'}
                </button>
              </div>
            )}

            {gameState === 'ticking' && (
              <div className="space-y-4 sm:space-y-6 w-full flex flex-col items-center">
                <div className="text-5xl sm:text-7xl animate-pulse">💣💥</div>
                <div className="text-xs sm:text-sm font-black text-rose-600 dark:text-rose-300 uppercase tracking-widest bg-rose-50 dark:bg-rose-950/60 px-4 py-1 rounded-full border border-rose-200 dark:border-rose-800">
                  {lang === 'ja' ? 'すばやく 単語を言って、パス！' : 'Say the word quickly and press PASS!'}
                </div>
                <div className="w-64 h-72 sm:w-80 sm:h-92 md:w-96 md:h-[420px] lg:w-[460px] lg:h-[480px]">
                  <CardView card={card} tier={defaultTier} showLabel={defaultTier !== 'picture_only'} size="auto" className="w-full h-full shadow-2xl" />
                </div>
                <button
                  onClick={handlePass}
                  className="px-8 sm:px-12 py-3.5 sm:py-4 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl sm:text-2xl rounded-2xl shadow-xl transform active:scale-95 transition"
                >
                  {lang === 'ja' ? '🏃 つぎの ひとへ パス！' : '🏃 PASS TO NEXT STUDENT!'}
                </button>
              </div>
            )}

            {gameState === 'exploded' && (
              <div className="space-y-4 animate-bounce">
                <div className="text-7xl sm:text-9xl">💥 BOOM! 💥</div>
                <h3 className="text-3xl sm:text-5xl font-black">
                  {lang === 'ja' ? 'ドカーン！ じかんぎれ！' : "TIME'S UP!"}
                </h3>
                <p className="text-lg sm:text-xl font-bold">
                  {lang === 'ja' ? 'ばくだんを 持っていた ひとは たのしい ポーズをしてね！' : 'Whoever is holding the bomb does a fun gesture!'}
                </p>
                <button
                  onClick={startBomb}
                  className="px-8 py-3.5 bg-white text-rose-700 font-black text-xl rounded-2xl shadow-lg mt-4 active:scale-95"
                >
                  {lang === 'ja' ? '🔄 もういっかい！' : '🔄 Play Again!'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- GAME 4: TYPHOON TEAM BATTLE ---
    function TyphoonGame({ unit, lang = 'en', onBack }) {
      const [scoreRed, setScoreRed] = useState(0);
      const [scoreWhite, setScoreWhite] = useState(0);
      const [activeTeam, setActiveTeam] = useState('red');
      const [crates, setCrates] = useState([]);
      const cards = unit.cards || [];

      const initGame = () => {
        const outcomes = ['+100', '+200', '+500', 'SWAP', 'TYPHOON', '+100', '+200', '+100', '+300', 'TYPHOON', '+200', '+100', '+500', 'SWAP', '+100', '+200'];
        const shuffledOutcomes = outcomes.sort(() => 0.5 - Math.random());
        const newCrates = shuffledOutcomes.map((reward, i) => ({
          id: i,
          reward,
          card: cards[i % cards.length],
          opened: false
        }));
        setCrates(newCrates);
        setScoreRed(0);
        setScoreWhite(0);
        setActiveTeam('red');
      };

      useEffect(() => {
        initGame();
      }, [unit]);

      const openCrate = (crate) => {
        if (crate.opened) return;
        playSoundEffect('flip');
        const updated = crates.map(c => c.id === crate.id ? { ...c, opened: true } : c);
        setCrates(updated);

        if (crate.reward.startsWith('+')) {
          const val = parseInt(crate.reward.replace('+', ''));
          playSoundEffect('correct');
          if (activeTeam === 'red') setScoreRed(s => s + val);
          else setScoreWhite(s => s + val);
        } else if (crate.reward === 'SWAP') {
          playSoundEffect('fanfare');
          const temp = scoreRed;
          setScoreRed(scoreWhite);
          setScoreWhite(temp);
        } else if (crate.reward === 'TYPHOON') {
          playSoundEffect('wrong');
          if (activeTeam === 'red') setScoreRed(0);
          else setScoreWhite(0);
        }

        setActiveTeam(t => t === 'red' ? 'white' : 'red');
      };

      return (
        <div className="w-full max-w-[1650px] mx-auto flex-1 flex flex-col justify-between space-y-3 sm:space-y-4 md:space-y-5">
          <div className="flex items-center justify-between bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl shadow border-2 border-indigo-200 dark:border-slate-700">
            <button onClick={onBack} className="text-gray-500 dark:text-slate-400 hover:text-indigo-700 dark:hover:text-indigo-300 font-bold text-xs sm:text-sm px-2.5 py-1 rounded-lg">
              {lang === 'ja' ? '← もどる' : '← Back'}
            </button>
            <h2 className="text-xl sm:text-2xl font-black text-indigo-800 dark:text-indigo-300">
              {lang === 'ja' ? '🌪️ たいふう チームバトル' : '🌪️ Typhoon Whole-Class Battle'}
            </h2>
            <button onClick={initGame} className="text-xs bg-gray-100 dark:bg-slate-700 dark:text-slate-200 hover:bg-gray-200 font-bold px-3 py-1.5 rounded-lg">
              {lang === 'ja' ? 'リセット' : 'Reset'}
            </button>
          </div>

          <div className="grid grid-cols-2 gap-3 sm:gap-4">
            <div className={`p-4 sm:p-5 rounded-2xl text-center border-4 transition ${
              activeTeam === 'red' ? 'bg-rose-500 text-white border-yellow-300 ring-4 ring-rose-200 shadow-lg' : 'bg-rose-50 dark:bg-slate-800 text-rose-900 dark:text-rose-200 border-rose-200 dark:border-slate-700'
            }`}>
              <div className="text-xs sm:text-sm font-black uppercase">{lang === 'ja' ? '赤組 (Red Team)' : 'Red Team (赤組)'}</div>
              <div className="text-3xl sm:text-5xl font-black mt-1">{scoreRed} pts</div>
              {activeTeam === 'red' && <div className="text-xs sm:text-sm font-bold mt-1 animate-pulse">{lang === 'ja' ? '👉 赤組の 番です！' : '👉 Turn to Pick!'}</div>}
            </div>

            <div className={`p-4 sm:p-5 rounded-2xl text-center border-4 transition ${
              activeTeam === 'white' ? 'bg-sky-500 text-white border-yellow-300 ring-4 ring-sky-200 shadow-lg' : 'bg-sky-50 dark:bg-slate-800 text-sky-900 dark:text-sky-200 border-sky-200 dark:border-slate-700'
            }`}>
              <div className="text-xs sm:text-sm font-black uppercase">{lang === 'ja' ? '白組 (White Team)' : 'White Team (白組)'}</div>
              <div className="text-3xl sm:text-5xl font-black mt-1">{scoreWhite} pts</div>
              {activeTeam === 'white' && <div className="text-xs sm:text-sm font-bold mt-1 animate-pulse">{lang === 'ja' ? '👉 白組の 番です！' : '👉 Turn to Pick!'}</div>}
            </div>
          </div>

          <div className="grid grid-cols-4 gap-2.5 sm:gap-3 md:gap-4 flex-1">
            {crates.map((crate) => (
              <div
                key={crate.id}
                onClick={() => openCrate(crate)}
                className={`h-32 sm:h-40 md:h-48 lg:h-56 xl:h-60 rounded-2xl border-3 flex flex-col items-center justify-center p-2 cursor-pointer transition transform hover:scale-105 active:scale-95 shadow ${
                  crate.opened ? 'bg-white dark:bg-slate-800 border-indigo-200 dark:border-slate-700' : 'bg-gradient-to-br from-amber-400 to-orange-500 text-white border-amber-300'
                }`}
              >
                {!crate.opened ? (
                  <div className="text-center">
                    <span className="text-3xl sm:text-5xl block">📦</span>
                    <span className="text-xs sm:text-sm font-black mt-1">#{crate.id + 1}</span>
                  </div>
                ) : (
                  <div className="text-center px-1">
                    <span className="text-sm sm:text-lg md:text-xl font-black text-gray-800 dark:text-slate-100 capitalize block line-clamp-1">
                      {crate.card.en}
                    </span>
                    <span className={`text-base sm:text-xl md:text-2xl font-black mt-1 block ${
                      crate.reward === 'TYPHOON' ? 'text-rose-600 animate-bounce' : crate.reward === 'SWAP' ? 'text-purple-600 dark:text-purple-400' : 'text-emerald-600 dark:text-emerald-400'
                    }`}>
                      {crate.reward === 'TYPHOON' ? '🌪️ TYPHOON!' : crate.reward === 'SWAP' ? '🔄 SWAP!' : crate.reward}
                    </span>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- GAME 5: 3-HINT MYSTERY QUIZ ---
    const QUIZ_KANJI_TILES = [
      { kanji: '一', kana: 'いち' },
      { kanji: '二', kana: 'に' },
      { kanji: '三', kana: 'さん' },
      { kanji: '四', kana: 'よん' },
      { kanji: '五', kana: 'ご' },
      { kanji: '六', kana: 'ろく' },
      { kanji: '七', kana: 'なな' },
      { kanji: '八', kana: 'はち' },
      { kanji: '九', kana: 'きゅう' },
      { kanji: '十', kana: 'じゅう' },
      { kanji: '十一', kana: 'じゅういち' },
      { kanji: '十二', kana: 'じゅうに' },
      { kanji: '十三', kana: 'じゅうさん' },
      { kanji: '十四', kana: 'じゅうよん' },
      { kanji: '十五', kana: 'じゅうご' },
      { kanji: '十六', kana: 'じゅうろく' },
    ];

    function MysteryQuizGame({ unit, defaultTier = 'picture_word', lang = 'en', onBack }) {
      const cards = unit.cards || [];
      const [currentIndex, setCurrentIndex] = useState(0);
      const [quizMode, setQuizMode] = useState('tiles'); // 'tiles' | 'mosaic' | 'zoom' | 'silhouette'
      const [gridSize, setGridSize] = useState('3x3'); // '2x2' | '3x3' | '4x4'
      const [lockCenter, setLockCenter] = useState(true);
      const [peeledTiles, setPeeledTiles] = useState([]);
      const [mosaicStage, setMosaicStage] = useState(0); // 0 (heavy blur) -> 1 -> 2 -> 3 (clear)
      const [zoomStage, setZoomStage] = useState(0); // 0 (350%) -> 1 (220%) -> 2 (140%) -> 3 (100%)
      const [silhouetteStage, setSilhouetteStage] = useState(0); // 0 (shadow) -> 1 (color hint) -> 2 (color)
      const [revealed, setRevealed] = useState(false);

      const currentCard = cards[currentIndex] || { en: 'Card', ja: 'カード' };

      const totalTileCount = gridSize === '4x4' ? 16 : gridSize === '3x3' ? 9 : 4;
      const tileList = Array.from({ length: totalTileCount }, (_, i) => i + 1);

      const resetRound = () => {
        setPeeledTiles([]);
        setMosaicStage(0);
        setZoomStage(0);
        setSilhouetteStage(0);
        setRevealed(false);
      };

      const nextQuestion = () => {
        resetRound();
        setCurrentIndex(prev => (prev + 1) % cards.length);
        playSoundEffect('bell');
      };

      const getIsCenterLocked = (tile) => {
        if (!lockCenter || revealed) return false;
        if (gridSize === '3x3') {
          if (tile !== 5) return false;
          const outerPeeled = peeledTiles.filter(t => t !== 5).length;
          return outerPeeled < 2; // Unlocks after 2 outer tiles are peeled
        }
        if (gridSize === '4x4') {
          const centerCluster = [6, 7, 10, 11];
          if (!centerCluster.includes(tile)) return false;
          const perimeterPeeled = peeledTiles.filter(t => !centerCluster.includes(t)).length;
          return perimeterPeeled < 3; // Unlocks after 3 perimeter tiles are peeled
        }
        return false;
      };

      const peelTile = (tileNum) => {
        if (peeledTiles.includes(tileNum)) return;
        if (getIsCenterLocked(tileNum)) {
          playSoundEffect('wrong');
          return;
        }
        playSoundEffect('flip');
        setPeeledTiles(prev => [...prev, tileNum]);
      };

      const handleReveal = () => {
        setRevealed(true);
        setPeeledTiles(tileList);
        setMosaicStage(3);
        setZoomStage(3);
        setSilhouetteStage(2);
        playSoundEffect('fanfare');
        try { confetti({ particleCount: 65, spread: 65 }); } catch(e){}
        setTimeout(() => {
          playCardAudio(currentCard);
        }, 350);
      };

      return (
        <div className="w-full max-w-[1600px] mx-auto flex-1 flex flex-col justify-between space-y-3 sm:space-y-4 md:space-y-5">
          {/* Header Bar with Mode Selector */}
          <div className="flex flex-wrap items-center justify-between bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl shadow border-2 border-purple-200 dark:border-slate-700 gap-2 sm:gap-3">
            <button onClick={onBack} className="text-gray-500 dark:text-slate-400 hover:text-purple-700 dark:hover:text-purple-300 font-bold text-xs sm:text-sm px-2.5 py-1 rounded-lg">
              {lang === 'ja' ? '← もどる' : '← Back'}
            </button>
            <h2 className="text-xl sm:text-2xl font-black text-purple-800 dark:text-purple-300">
              {lang === 'ja' ? '🔍 なぞなぞ・絵あてクイズ' : '🔍 Mystery Picture Quiz'}
            </h2>

            {/* Quiz Modes */}
            <div className="flex flex-wrap items-center gap-2">
              <div className="flex bg-purple-50 dark:bg-slate-800 p-1 rounded-xl border border-purple-200 dark:border-slate-700 text-xs items-center gap-0.5 sm:gap-1">
                <button
                  onClick={() => { setQuizMode('tiles'); resetRound(); }}
                  className={`px-2.5 py-1 rounded-lg font-bold transition ${quizMode === 'tiles' ? 'bg-purple-600 text-white shadow' : 'text-purple-800 dark:text-purple-300'}`}
                  title={lang === 'ja' ? 'パネルめくりクイズ' : 'Tile Peel Quiz'}
                >
                  🧩 {lang === 'ja' ? 'パネル' : 'Tiles'}
                </button>
                <button
                  onClick={() => { setQuizMode('mosaic'); resetRound(); }}
                  className={`px-2.5 py-1 rounded-lg font-bold transition ${quizMode === 'mosaic' ? 'bg-purple-600 text-white shadow' : 'text-purple-800 dark:text-purple-300'}`}
                  title={lang === 'ja' ? 'モザイク・ぼかしクイズ' : 'Mosaic Blur Quiz'}
                >
                  🌫️ {lang === 'ja' ? 'モザイク' : 'Mosaic'}
                </button>
                <button
                  onClick={() => { setQuizMode('zoom'); resetRound(); }}
                  className={`px-2.5 py-1 rounded-lg font-bold transition ${quizMode === 'zoom' ? 'bg-purple-600 text-white shadow' : 'text-purple-800 dark:text-purple-300'}`}
                  title={lang === 'ja' ? 'ズームアウトクイズ' : 'Zoom-Out Quiz'}
                >
                  🔍 {lang === 'ja' ? 'ズーム' : 'Zoom'}
                </button>
                <button
                  onClick={() => { setQuizMode('silhouette'); resetRound(); }}
                  className={`px-2.5 py-1 rounded-lg font-bold transition ${quizMode === 'silhouette' ? 'bg-purple-600 text-white shadow' : 'text-purple-800 dark:text-purple-300'}`}
                  title={lang === 'ja' ? 'シルエット・影絵クイズ' : 'Silhouette Quiz'}
                >
                  👤 {lang === 'ja' ? 'シルエット' : 'Shadow'}
                </button>
              </div>

              <button onClick={nextQuestion} className="px-3 py-1.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-bold shadow active:scale-95">
                {lang === 'ja' ? 'つぎの もんだい →' : 'Next Question →'}
              </button>
            </div>
          </div>

          {/* Sub-toolbar for Tile mode */}
          {quizMode === 'tiles' && (
            <div className="flex flex-wrap items-center justify-center gap-2 bg-purple-50/80 dark:bg-slate-800/80 p-2 rounded-xl border border-purple-200 dark:border-purple-800 text-xs">
              <span className="font-black text-purple-800 dark:text-purple-300">
                {lang === 'ja' ? 'パネル数:' : 'Grid Size:'}
              </span>
              <button
                onClick={() => { setGridSize('2x2'); resetRound(); }}
                className={`px-2.5 py-0.5 rounded-lg font-bold transition ${gridSize === '2x2' ? 'bg-purple-600 text-white shadow' : 'bg-white dark:bg-slate-700 text-purple-800 dark:text-purple-200'}`}
              >
                2×2 (4枚)
              </button>
              <button
                onClick={() => { setGridSize('3x3'); resetRound(); }}
                className={`px-2.5 py-0.5 rounded-lg font-bold transition ${gridSize === '3x3' ? 'bg-purple-600 text-white shadow' : 'bg-white dark:bg-slate-700 text-purple-800 dark:text-purple-200'}`}
              >
                3×3 (9枚)
              </button>
              <button
                onClick={() => { setGridSize('4x4'); resetRound(); }}
                className={`px-2.5 py-0.5 rounded-lg font-bold transition ${gridSize === '4x4' ? 'bg-purple-600 text-white shadow' : 'bg-white dark:bg-slate-700 text-purple-800 dark:text-purple-200'}`}
              >
                4×4 (16枚)
              </button>

              {gridSize !== '2x2' && (
                <button
                  onClick={() => setLockCenter(!lockCenter)}
                  className={`ml-1 sm:ml-3 px-2.5 py-0.5 rounded-lg font-bold transition flex items-center gap-1 ${
                    lockCenter
                      ? 'bg-amber-500 text-white shadow'
                      : 'bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-slate-300'
                  }`}
                  title={lang === 'ja' ? '外側を数枚開けるまで、真ん中のパネルをロックする' : 'Lock center tile(s) until outer tiles are opened'}
                >
                  <span>{lockCenter ? '🔒' : '🔓'}</span>
                  <span>{lang === 'ja' ? `真ん中ロック: ${lockCenter ? 'ON' : 'OFF'}` : `Center Lock: ${lockCenter ? 'ON' : 'OFF'}`}</span>
                </button>
              )}
            </div>
          )}

          {/* Main Quiz Arena */}
          <div className="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-3xl border-4 border-purple-200 dark:border-slate-700 flex flex-col items-center text-center space-y-4 sm:space-y-6 shadow-lg flex-1 justify-between">
            <div className="space-y-1">
              <span className="text-xs font-black uppercase text-purple-600 dark:text-purple-300 bg-purple-50 dark:bg-purple-950/60 px-3 py-1 rounded-full border border-purple-200 dark:border-purple-800">
                {quizMode === 'tiles' ? (lang === 'ja' ? '🧩 パネルめくり' : 'Tile Peel')
                  : quizMode === 'mosaic' ? (lang === 'ja' ? '🌫️ モザイク' : 'Mosaic Blur')
                  : quizMode === 'zoom' ? (lang === 'ja' ? '🔍 ズームアウト' : 'Zoom Out')
                  : (lang === 'ja' ? '👤 シルエット' : 'Silhouette')}
              </span>
              <h3 className="text-2xl sm:text-3xl font-black text-purple-950 dark:text-purple-200">
                {revealed
                  ? (lang === 'ja' ? `🎉 正解は: ${currentCard.en} (${currentCard.ja}) でした！` : `🎉 Answer: ${currentCard.en}! (${currentCard.ja})`)
                  : (lang === 'ja' ? '「これ なーんだ？ あててみてね！」' : "What's this? Can you guess?")}
              </h3>
              <p className="text-xs sm:text-sm text-gray-500 dark:text-slate-400">
                {quizMode === 'tiles'
                  ? (lang === 'ja'
                      ? `パネル（${gridSize === '4x4' ? '一〜十六' : gridSize === '3x3' ? '一〜九' : '一〜四'}）を タップして 少しずつ 開けてみよう！`
                      : `Tap tiles (1 to ${totalTileCount}) to reveal parts of the hidden picture!`)
                  : quizMode === 'mosaic'
                  ? (lang === 'ja' ? '「ピントを合わせる」ボタンを おして、だんだん クリアにしよう！' : 'Sharpen the blur step-by-step to reveal the image!')
                  : quizMode === 'zoom'
                  ? (lang === 'ja' ? '「ズームアウト」ボタンを おして、すこしずつ 離れてみよう！' : 'Zoom out step-by-step from the micro-detail!')
                  : (lang === 'ja' ? '黒い影（シルエット）の 形から なにか あててみてね！' : 'Guess the secret object from its silhouette outline!')}
              </p>
            </div>

            {/* Visual Display Box */}
            <div className="relative w-full max-w-sm sm:max-w-md md:max-w-lg lg:max-w-xl h-[380px] sm:h-[460px] md:h-[520px] lg:h-[560px] rounded-3xl overflow-hidden border-4 border-purple-300 dark:border-purple-700 shadow-2xl bg-purple-50 dark:bg-slate-900 flex items-center justify-center">
              <div
                className="w-full h-full p-3 sm:p-4 flex flex-col items-center justify-center transition-all duration-500 ease-out overflow-hidden"
                style={
                  revealed
                    ? { filter: 'none', transform: 'scale(1)' }
                    : quizMode === 'mosaic'
                    ? {
                        filter: mosaicStage === 0 ? 'blur(28px)' : mosaicStage === 1 ? 'blur(15px)' : mosaicStage === 2 ? 'blur(6px)' : 'none',
                        transform: 'scale(1.15)',
                      }
                    : quizMode === 'zoom'
                    ? {
                        transform: zoomStage === 0 ? 'scale(3.4)' : zoomStage === 1 ? 'scale(2.2)' : zoomStage === 2 ? 'scale(1.4)' : 'scale(1)',
                        transformOrigin: 'center center',
                      }
                    : quizMode === 'silhouette'
                    ? {
                        filter: silhouetteStage === 0 ? 'brightness(0) drop-shadow(0 0 10px rgba(139, 92, 246, 0.4))' : silhouetteStage === 1 ? 'brightness(0.3) saturate(250%)' : 'none',
                        transform: 'scale(1)',
                      }
                    : { filter: 'none', transform: 'scale(1)' }
                }
              >
                <CardView card={currentCard} tier={defaultTier} showLabel={revealed && defaultTier !== 'picture_only'} size="auto" className="w-full h-full" />
              </div>

              {/* Tiles Grid Overlay (Only active in 'tiles' mode) */}
              {quizMode === 'tiles' && (
                <div className={`absolute inset-0 grid ${
                  gridSize === '4x4' ? 'grid-cols-4 grid-rows-4' : gridSize === '3x3' ? 'grid-cols-3 grid-rows-3' : 'grid-cols-2 grid-rows-2'
                }`}>
                  {tileList.map((tile) => {
                    const isPeeled = peeledTiles.includes(tile);
                    const isLocked = getIsCenterLocked(tile);
                    const tileInfo = QUIZ_KANJI_TILES[tile - 1];
                    return (
                      <div
                        key={tile}
                        onClick={() => peelTile(tile)}
                        className={`border-2 border-white/80 flex flex-col items-center justify-center cursor-pointer transition duration-300 active:scale-95 select-none ${
                          isPeeled
                            ? 'opacity-0 pointer-events-none'
                            : isLocked
                            ? 'bg-gradient-to-br from-amber-600 to-orange-700 text-white shadow-inner hover:brightness-105'
                            : 'bg-gradient-to-br from-purple-500 to-indigo-600 text-white shadow-inner hover:brightness-110'
                        }`}
                      >
                        {!isPeeled && (
                          isLocked ? (
                            <div className="flex flex-col items-center justify-center text-center">
                              <span className={`${gridSize === '4x4' ? 'text-xl sm:text-3xl' : gridSize === '3x3' ? 'text-2xl sm:text-4xl' : 'text-3xl sm:text-5xl'} animate-pulse`}>
                                🔒
                              </span>
                              <span className="text-[9px] sm:text-[11px] font-black text-amber-200 mt-0.5">
                                {lang === 'ja' ? '外側から！' : 'Locked'}
                              </span>
                            </div>
                          ) : (
                            <div className="flex flex-col items-center justify-center text-center">
                              <span className={`${
                                gridSize === '4x4' ? 'text-xl sm:text-3xl md:text-4xl' : gridSize === '3x3' ? 'text-3xl sm:text-4xl md:text-5xl' : 'text-4xl sm:text-6xl md:text-7xl'
                              } font-black drop-shadow-md leading-none`}>
                                {tileInfo?.kanji}
                              </span>
                              <span className={`${gridSize === '4x4' ? 'text-[9px] sm:text-[10px]' : gridSize === '3x3' ? 'text-[10px] sm:text-xs' : 'text-xs sm:text-sm'} font-bold text-purple-100 opacity-90 mt-0.5`}>
                                {tileInfo?.kana}
                              </span>
                            </div>
                          )
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Prominent Answer Overlay Banner on Reveal */}
              {revealed && (
                <div className="absolute bottom-3 inset-x-3 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md p-3 sm:p-4 rounded-2xl shadow-2xl border-2 border-purple-400 dark:border-purple-500 text-center z-10 animate-bounce">
                  <div className="text-[10px] sm:text-xs font-black uppercase tracking-widest text-purple-600 dark:text-purple-300 mb-0.5">
                    {lang === 'ja' ? '🎉 せいかい (Answer):' : '🎉 Answer:'}
                  </div>
                  <div className="text-xl sm:text-3xl md:text-4xl font-black text-purple-950 dark:text-white flex items-center justify-center gap-2 flex-wrap">
                    <span>{currentCard.en}</span>
                    <span className="text-base sm:text-xl md:text-2xl font-bold text-purple-600 dark:text-purple-300">
                      ({currentCard.ja})
                    </span>
                    <button
                      onClick={(e) => { e.stopPropagation(); playCardAudio(currentCard); }}
                      className="ml-1 sm:ml-2 p-1.5 sm:p-2 bg-purple-500 hover:bg-purple-600 text-white rounded-xl text-sm sm:text-base active:scale-95 shadow"
                      title={lang === 'ja' ? '英語の音声を聴く' : 'Hear pronunciation'}
                    >
                      🔊
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* Mode-Specific Hint Controls */}
            <div className="flex flex-wrap items-center justify-center gap-3">
              {quizMode === 'mosaic' && !revealed && (
                <button
                  onClick={() => {
                    playSoundEffect('flip');
                    setMosaicStage(s => Math.min(s + 1, 3));
                  }}
                  className="px-6 sm:px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-base sm:text-lg rounded-xl shadow transition active:scale-95 flex items-center gap-2"
                >
                  <span>🌫️</span>
                  <span>{lang === 'ja' ? `ピントを合わせる (${mosaicStage + 1}/3)` : `Sharpen Focus (${mosaicStage + 1}/3)`}</span>
                </button>
              )}

              {quizMode === 'zoom' && !revealed && (
                <button
                  onClick={() => {
                    playSoundEffect('flip');
                    setZoomStage(s => Math.min(s + 1, 3));
                  }}
                  className="px-6 sm:px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-base sm:text-lg rounded-xl shadow transition active:scale-95 flex items-center gap-2"
                >
                  <span>🔍</span>
                  <span>{lang === 'ja' ? `ズームアウト (${zoomStage + 1}/3)` : `Zoom Out (${zoomStage + 1}/3)`}</span>
                </button>
              )}

              {quizMode === 'silhouette' && !revealed && (
                <button
                  onClick={() => {
                    playSoundEffect('flip');
                    setSilhouetteStage(s => Math.min(s + 1, 2));
                  }}
                  className="px-6 sm:px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-base sm:text-lg rounded-xl shadow transition active:scale-95 flex items-center gap-2"
                >
                  <span>🎨</span>
                  <span>{lang === 'ja' ? '色のヒント' : 'Color Hint'}</span>
                </button>
              )}

              {/* Reveal and Next buttons */}
              <button
                onClick={handleReveal}
                className="px-6 sm:px-8 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-base sm:text-lg rounded-xl shadow transition active:scale-95"
              >
                {lang === 'ja' ? '👁️ こたえを みる！' : '👁️ Reveal Answer!'}
              </button>
              <button
                onClick={nextQuestion}
                className="px-6 sm:px-8 py-3 bg-purple-600 hover:bg-purple-700 text-white font-black text-base sm:text-lg rounded-xl shadow transition active:scale-95"
              >
                {lang === 'ja' ? 'つぎの もんだい →' : 'Next Mystery Card →'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- GAME 6: WHAT'S MISSING? ---
    function WhatsMissingGame({ unit, defaultTier = 'picture_only', lang = 'en', onBack }) {
      const cards = unit.cards || [];
      const [gameTier, setGameTier] = useState(defaultTier || 'picture_only');
      const [shuffleOrder, setShuffleOrder] = useState(true);
      const [tray, setTray] = useState([]);
      const [missingCard, setMissingCard] = useState(null);
      const [isBlindsClosed, setIsBlindsClosed] = useState(false);
      const [isRemoved, setIsRemoved] = useState(false);
      const [isRevealed, setIsRevealed] = useState(false);

      const setupRound = () => {
        const sample = [...cards].sort(() => 0.5 - Math.random()).slice(0, 6);
        setTray(sample);
        setMissingCard(null);
        setIsBlindsClosed(false);
        setIsRemoved(false);
        setIsRevealed(false);
      };

      useEffect(() => {
        setupRound();
      }, [unit]);

      const closeBlinds = () => {
        playSoundEffect('flip');
        setIsBlindsClosed(true);

        // Hide card and shuffle completely behind the opaque curtain
        setTimeout(() => {
          const randomIdx = Math.floor(Math.random() * tray.length);
          const picked = tray[randomIdx];
          setMissingCard(picked);
          if (shuffleOrder) {
            setTray(prev => [...prev].sort(() => 0.5 - Math.random()));
          }
          setIsRemoved(true);

          setTimeout(() => {
            setIsBlindsClosed(false);
            playSoundEffect('bell');
          }, 850);
        }, 400);
      };

      const revealMissing = () => {
        setIsRevealed(true);
        playSoundEffect('correct');
        if (missingCard) {
          setTimeout(() => {
            playCardAudio(missingCard);
          }, 300);
        }
      };

      return (
        <div className="w-full max-w-[1650px] mx-auto flex-1 flex flex-col justify-between space-y-3 sm:space-y-4 md:space-y-5">
          <div className="flex flex-wrap items-center justify-between bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl shadow border-2 border-teal-200 dark:border-slate-700 gap-2 sm:gap-3">
            <button onClick={onBack} className="text-gray-500 dark:text-slate-400 hover:text-teal-700 dark:hover:text-teal-300 font-bold text-xs sm:text-sm px-2.5 py-1 rounded-lg">
              {lang === 'ja' ? '← もどる' : '← Back'}
            </button>
            <h2 className="text-xl sm:text-2xl font-black text-teal-800 dark:text-teal-300">
              {lang === 'ja' ? '👀 なにが きえた？' : "👀 What's Missing?"}

              <div className="flex bg-teal-50 dark:bg-slate-800 p-1 rounded-xl border border-teal-300 dark:border-slate-700 text-xs">

                  onClick={() => setGameTier('picture_only')}
                  className={`px-2.5 py-1 rounded-lg font-bold transition ${gameTier === 'picture_only' ? 'bg-teal-600 text-white shadow' : 'text-teal-900 dark:text-teal-300'}`}
                  title="Picture Only"
                >
                  🎨 {lang === 'ja' ? 'イラスト' : 'Pic Only'}
                </button>
                <button
                  onClick={() => setGameTier('picture_word')}
                  className={`px-2.5 py-1 rounded-lg font-bold transition ${gameTier === 'picture_word' ? 'bg-teal-600 text-white shadow' : 'text-teal-900 dark:text-teal-300'}`}
                  title="Picture + Word"
                >
                  🖼️ {lang === 'ja' ? '絵＋文字' : 'Pic+Word'}
                </button>
                <button
                  onClick={() => setGameTier('word_only')}
                  className={`px-2.5 py-1 rounded-lg font-bold transition ${gameTier === 'word_only' ? 'bg-teal-600 text-white shadow' : 'text-teal-900 dark:text-teal-300'}`}
                  title="Word Only"
                >
                  🔤 {lang === 'ja' ? 'えいご' : 'Word Only'}
                </button>
              </div>

              <button
                onClick={() => setShuffleOrder(!shuffleOrder)}
                className={`text-xs p-1.5 px-3 rounded-xl font-bold border transition flex items-center gap-1.5 shadow-sm ${
                  shuffleOrder
                    ? 'bg-teal-600 text-white border-teal-700 dark:border-teal-500'
                    : 'bg-teal-50 dark:bg-slate-800 text-teal-800 dark:text-teal-300 border-teal-300 dark:border-slate-700'
                }`}
                title={lang === 'ja' ? 'カーテンの裏で カードの並び順を シャッフルする' : 'Shuffle card order behind the blinds'}
              >
                <span>🔀</span>
                <span>{lang === 'ja' ? `シャッフル: ${shuffleOrder ? 'ON' : 'OFF'}` : `Shuffle: ${shuffleOrder ? 'ON' : 'OFF'}`}</span>
              </button>

              <button onClick={setupRound} className="text-xs bg-teal-50 dark:bg-slate-700 dark:text-teal-300 hover:bg-teal-100 dark:hover:bg-slate-600 font-bold px-3 py-1.5 rounded-lg text-teal-800">
                {lang === 'ja' ? '🔄 あたらしい カード' : '🔄 New Cards'}
              </button>
            </div>
          </div>

          <div className="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-3xl border-4 border-teal-200 dark:border-slate-700 flex flex-col items-center space-y-4 sm:space-y-6 shadow-lg flex-1 justify-between">
            <div className="text-center">
              <h3 className="text-xl sm:text-2xl md:text-3xl font-black text-teal-950 dark:text-teal-200">
                {isRevealed
                  ? (lang === 'ja' ? `正解は: ${missingCard?.en} (${missingCard?.ja}) でした！` : `It was: ${missingCard?.en}!`)
                  : isRemoved
                  ? (lang === 'ja' ? 'きえた カードは なーんだ？ 元気に いってみよう！' : 'Which card is missing? Shout it out!')
                  : (lang === 'ja' ? '6まいの カードを よくおぼえて、カーテンを閉めよう！' : 'Look at all 6 cards closely, then close the blinds!')}

            <div className="flex gap-3">

    // --- GAME 9: MUSICAL FREEZE ---
    function MusicalFreezeGame({ unit, defaultTier = 'picture_word', lang = 'en', onBack }) {
      const cards = unit.cards || [];
      const [isPlaying, setIsPlaying] = useState(false);
      const [isFrozen, setIsFrozen] = useState(false);
      const [currentCard, setCurrentCard] = useState(null);
      const synthRef = useRef(null);

      const startBeat = () => {
        setIsFrozen(false);
        setIsPlaying(true);
        const ctx = getAudioContext();
        let step = 0;
        const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];

        synthRef.current = setInterval(() => {
          try {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(notes[step % notes.length], ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.18);
            step++;
          } catch(e){}
        }, 180);
      };

      const stopBeat = () => {
        if (synthRef.current) {
          clearInterval(synthRef.current);
          synthRef.current = null;
        }
      };

      const triggerFreeze = () => {
        stopBeat();
        setIsPlaying(false);
        setIsFrozen(true);
        playSoundEffect('wrong');
        const picked = cards[Math.floor(Math.random() * cards.length)];
        setCurrentCard(picked);
        setTimeout(() => playCardAudio(picked), 300);
      };

      useEffect(() => {
        return () => stopBeat();
      }, []);

      return (
        <div className="w-full max-w-[1600px] mx-auto flex-1 flex flex-col justify-between space-y-3 sm:space-y-4 md:space-y-5">

    // --- GAME 10: PARFAIT & PIZZA CHEF ---
    function ParfaitChefGame({ unit, defaultTier = 'picture_word', lang = 'en', onBack }) {
      const cards = unit.cards || [];
      const [order, setOrder] = useState([]);
      const [bowl, setBowl] = useState({});
      const [served, setServed] = useState(false);
      const [isSuccess, setIsSuccess] = useState(false);

      const speakOrder = (currentOrder = order) => {
        if (!currentOrder || !currentOrder.length) return;
        const speechText = `I'd like ${currentOrder.map(o => `${o.qty} ${o.card.en}`).join(' and ')}, please!`;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(speechText);
          utter.lang = 'en-US';
          utter.rate = 0.88;
          window.speechSynthesis.speak(utter);
        }
      };

      const generateOrder = () => {
        const sample = [...cards].sort(() => 0.5 - Math.random()).slice(0, 2);
        const newOrder = sample.map(c => ({ card: c, qty: Math.floor(Math.random() * 2) + 1 }));
        setOrder(newOrder);
        setBowl({});
        setServed(false);
        setIsSuccess(false);
        playSoundEffect('bell');
        setTimeout(() => speakOrder(newOrder), 350);
      };

      useEffect(() => {
        generateOrder();
      }, [unit]);

      const addIngredient = (c) => {
        if (served) return;
        playSoundEffect('pop');
        setBowl(prev => ({ ...prev, [c.id]: (prev[c.id] || 0) + 1 }));
      };

      const clearDish = () => {
        playSoundEffect('pop');
        setBowl({});
        setServed(false);
      };

      const serveDish = () => {
        setServed(true);
        let match = true;
        for (const item of order) {
          if ((bowl[item.card.id] || 0) !== item.qty) match = false;
        }
        // Also ensure no excess ingredients were added that were not part of the order
        for (const [cardId, qty] of Object.entries(bowl)) {
          if (qty > 0 && !order.some(item => item.card.id === cardId && item.qty === qty)) {
            match = false;
          }
        }
        if (match) {
          setIsSuccess(true);
          playSoundEffect('fanfare');
          try { confetti({ particleCount: 70, spread: 60 }); } catch(e){}
        } else {
          setIsSuccess(false);
          playSoundEffect('wrong');
        }
      };

      return (
        <div className="w-full max-w-[1650px] mx-auto space-y-4 sm:space-y-6">
          <div className="flex items-center justify-between bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl shadow border-2 border-amber-200 dark:border-slate-700">
            <button onClick={onBack} className="text-gray-500 dark:text-slate-400 hover:text-amber-700 dark:hover:text-amber-300 font-bold text-xs sm:text-sm px-2.5 py-1 rounded-lg">
              {lang === 'ja' ? '← もどる (アーケード)' : '← Back to Arcade'}
            </button>
            <h2 className="text-xl sm:text-2xl font-black text-amber-800 dark:text-amber-300">
              {lang === 'ja' ? '🍨 フルーツパフェ ＆ ピザ屋さん' : '🍨 Fruit Parfait & Pizza Chef'}
            </h2>
            <button onClick={generateOrder} className="text-xs bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-1.5 rounded-lg shadow active:scale-95 transition">
              {lang === 'ja' ? '🔄 つぎの お客さん' : '🔄 Next Customer'}
            </button>
          </div>

          <div className="bg-amber-100 dark:bg-amber-950/60 p-3.5 sm:p-4 rounded-3xl border-4 border-amber-300 dark:border-amber-700 flex items-center justify-between gap-3 shadow-sm">
            <div className="flex items-center gap-3 sm:gap-4">
              <span className="text-4xl sm:text-5xl select-none">🧑‍🍳</span>
              <div>
                <div className="text-[11px] sm:text-xs font-black uppercase text-amber-800 dark:text-amber-300 tracking-wider">
                  {lang === 'ja' ? 'お客さんの ごちゅうもん:' : 'Customer Order:'}
                </div>
                <div className="text-lg sm:text-2xl md:text-3xl font-black text-amber-950 dark:text-white">
                  "I'd like {order.map(o => `${o.qty} ${o.card.en}`).join(' and ')}, please!"
                </div>
                {lang === 'ja' && (
                  <div className="text-xs sm:text-sm text-amber-800 dark:text-amber-300 font-bold mt-0.5">
                    「{order.map(o => `${o.card.ja} を ${o.qty}こ`).join(' と ')} ください！」
                  </div>
                )}
              </div>
            </div>
            <button
              onClick={() => speakOrder(order)}
              className="p-2.5 sm:p-3 bg-amber-400 hover:bg-amber-500 text-white rounded-2xl shadow active:scale-95 transition text-xl sm:text-2xl flex-shrink-0"
              title={lang === 'ja' ? '注文を きく' : 'Hear Customer Order'}
            >
              🔊
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-5 items-start">
            {/* LEFT: YOUR DISH (NARROWED & OPTIMIZED) */}
            <div className="lg:col-span-4 xl:col-span-4 bg-white dark:bg-slate-800/90 p-4 sm:p-5 rounded-3xl border-4 border-amber-200 dark:border-slate-700 flex flex-col justify-between shadow-lg space-y-3">
              <div className="flex items-center justify-between">
                <h4 className="font-black text-amber-900 dark:text-amber-300 text-base sm:text-lg">
                  {lang === 'ja' ? '🥣 あなたのお皿' : '🥣 Your Dish'}
                </h4>
                {Object.keys(bowl).length > 0 && !served && (
                  <button
                    onClick={clearDish}
                    className="text-xs text-rose-600 hover:text-rose-800 font-bold bg-rose-50 dark:bg-rose-950/60 px-2.5 py-1 rounded-lg border border-rose-200 dark:border-rose-800 active:scale-95"
                  >
                    {lang === 'ja' ? '🗑️ ぜんぶ戻す' : '🗑️ Clear'}
                  </button>
                )}
              </div>

              <div className="w-full h-44 sm:h-52 md:h-60 bg-amber-50 dark:bg-slate-900 rounded-3xl border-4 border-amber-300 dark:border-slate-700 flex flex-wrap items-center justify-center p-3 gap-2 overflow-y-auto">
                {Object.keys(bowl).length === 0 ? (
                  <span className="text-gray-400 dark:text-slate-500 font-bold text-sm sm:text-base text-center">
                    {lang === 'ja' ? '右の ざいりょう を タップして 追加してね！' : 'Tap pantry items to add ingredients!'}
                  </span>
                ) : (
                  Object.entries(bowl).map(([cardId, qty]) => {
                    const c = cards.find(x => x.id === cardId);
                    return (
                      <span key={cardId} className="bg-white dark:bg-slate-800 px-3 py-1.5 rounded-full border border-amber-300 dark:border-slate-600 font-black text-xs sm:text-sm shadow-sm animate-bounce text-slate-800 dark:text-slate-100">
                        {c?.en} x{qty}
                      </span>
                    );
                  })
                )}
              </div>

              {served ? (
                <div className={`p-3 rounded-2xl font-black w-full text-center text-base sm:text-lg ${isSuccess ? 'bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300' : 'bg-rose-100 dark:bg-rose-950/80 text-rose-800 dark:text-rose-300'}`}>
                  {isSuccess
                    ? (lang === 'ja' ? '🎉 「ありがとう！ おいしそう！」' : '🎉 "Thank you! Delicious!"')
                    : (lang === 'ja' ? '😅 「あれ？ ちゅうもん を たしかめてね！」' : '😅 "Oops! Check the recipe!"')}
                </div>
              ) : (
                <button
                  onClick={serveDish}
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-base sm:text-lg rounded-2xl shadow active:scale-95 transition"
                >
                  {lang === 'ja' ? '🍽️ 「Here you are! (どうぞ！)」' : '🍽️ "Here you are!" (Serve)'}
                </button>
              )}
            </div>

            {/* RIGHT: KITCHEN PANTRY (EXPANDED TO 4-5 COLUMNS, STRICTLY ADHERES TO SELECTED TIER WITHOUT TEXT SPOILERS) */}
            <div className="lg:col-span-8 xl:col-span-8 bg-white dark:bg-slate-800/90 p-4 sm:p-5 rounded-3xl border-4 border-amber-200 dark:border-slate-700 shadow-lg space-y-3">
              <div className="flex items-center justify-between">
                <h4 className="font-black text-amber-900 dark:text-amber-300 text-base sm:text-lg">
                  {lang === 'ja' ? '🧺 ざいりょう (キッチン)' : '🧺 Kitchen Pantry'}
                </h4>
                <span className="text-xs text-amber-700 dark:text-amber-300 font-bold bg-amber-100 dark:bg-amber-950/70 px-2.5 py-1 rounded-full">
                  {cards.length} {lang === 'ja' ? 'しゅるい • タップして 追加' : 'items • Tap to add'}
                </span>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-4 2xl:grid-cols-5 gap-2 sm:gap-2.5 p-1 overflow-y-auto max-h-[640px] xl:max-h-none">
                {cards.map(c => (
                  <div
                    key={c.id}
                    onClick={() => addIngredient(c)}
                    className="h-24 sm:h-28 md:h-32 rounded-2xl cursor-pointer active:scale-95 transition transform hover:scale-103"
                    title={c.en}
                  >
                    <CardView
                      card={c}
                      tier={defaultTier}
                      showLabel={false}
                      size="auto"
                      className="w-full h-full shadow-sm hover:shadow-md hover:border-amber-400"
                    />
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

        { id: 'library', name: 'Library', jaName: 'としょしつ', kanji: '図書室', icon: '📚', x: 3, y: 0, imgFile: 'dic_wb_05schoollife_library_1253_1_ce.png' },
        { id: 'classroom', name: 'Classroom', jaName: 'きょうしつ', kanji: '教室', icon: '🏫', x: 0, y: 1, imgFile: 'dic_wb_05schoollife_classroom_1248_1_ce.png' },
        { id: 'staff_room', name: "Teachers' Office", jaName: 'しょくいんしつ', kanji: '職員室', icon: '💼', x: 1, y: 1, imgFile: 'dic_4_card_teachersoffice_2634_1_ce.png' },
        { id: 'gym', name: 'Gym', jaName: 'たいいくかん', kanji: '体育館', icon: '🏀', x: 2, y: 1, imgFile: 'dic_wb_05schoollife_gym_1252_1_ce.png' },
        { id: 'entrance', name: 'Entrance', jaName: 'げんかん', kanji: '玄関', icon: '🚪', x: 3, y: 1, imgFile: 'dic_wb_05schoollife_entrance_1250_1_ce.png', isStart: true },
      ];

      // Facing directions without compass jargon (0: Forward/Up, 1: Right, 2: Backward/Down, 3: Left)
      const FACING_DIRS = [
        { id: 0, arrow: '⬆️', dx: 0, dy: -1 },
        { id: 1, arrow: '➡️', dx: 1, dy: 0 },
        { id: 2, arrow: '⬇️', dx: 0, dy: 1 },
        { id: 3, arrow: '⬅️', dx: -1, dy: 0 },
      ];

      const [playerPos, setPlayerPos] = useState({ x: 3, y: 1 });
      const [facing, setFacing] = useState(0); // Starts facing forward towards Library!
      const [navMode, setNavMode] = useState('walking'); // 'walking' (Turn & Go) | 'dpad' (Direct arrow)
      const [targetRoom, setTargetRoom] = useState(rooms[0]);
      const [score, setScore] = useState(0);
      const [bump, setBump] = useState(false);

      const speakMission = (room = targetRoom) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(`Excuse me. Where is the ${room.name}?`);
          utter.lang = 'en-US';
          utter.rate = 0.88;
          window.speechSynthesis.speak(utter);
        }
      };

      useEffect(() => {
        const timer = setTimeout(() => speakMission(targetRoom), 400);
        return () => clearTimeout(timer);
      }, [targetRoom]);

      const attemptMove = (dx, dy, newFacing = null) => {
        const nx = playerPos.x + dx;
        const ny = playerPos.y + dy;
        if (nx < 0 || nx > 3 || ny < 0 || ny > 1) {
          playSoundEffect('wrong');
          setBump(true);
          setTimeout(() => setBump(false), 350);
          return;
        }
        setPlayerPos({ x: nx, y: ny });
        if (newFacing !== null) setFacing(newFacing);
        playSoundEffect('pop');

        if (nx === targetRoom.x && ny === targetRoom.y) {
          playSoundEffect('fanfare');
          setScore(s => s + 200);
          try { confetti({ particleCount: 70, spread: 60 }); } catch(e){}
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(`Here it is! You found the ${targetRoom.name}!`);
            utter.lang = 'en-US';
            window.speechSynthesis.speak(utter);
          }
          const otherRooms = rooms.filter(r => r.id !== targetRoom.id && !r.isStart);
          const nextTarget = otherRooms[Math.floor(Math.random() * otherRooms.length)];
          setTargetRoom(nextTarget);
        }
      };

      // Walking Tour (Turn & Go) Handlers:
      const turnLeft = () => {
        playSoundEffect('pop');
        setFacing(f => (f + 3) % 4);
      };

      const turnRight = () => {
        playSoundEffect('pop');
        setFacing(f => (f + 1) % 4);
      };

      const goStraight = () => {
        const dir = FACING_DIRS[facing];
        attemptMove(dir.dx, dir.dy);
      };

      const goBack = () => {
        const dir = FACING_DIRS[facing];
        attemptMove(-dir.dx, -dir.dy);
      };

      const currentDir = FACING_DIRS[facing];
      const reverseDir = FACING_DIRS[(facing + 2) % 4];

      return (
        <div className="w-full max-w-[1600px] mx-auto space-y-4 sm:space-y-6">
          <div className="flex items-center justify-between bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl shadow border-2 border-indigo-200 dark:border-slate-700">
            <button onClick={onBack} className="text-gray-500 dark:text-slate-400 hover:text-indigo-700 dark:hover:text-indigo-300 font-bold text-xs sm:text-sm px-2.5 py-1 rounded-lg">
              {lang === 'ja' ? '← もどる (アーケード)' : '← Back to Arcade'}
            </button>
            <h2 className="text-xl sm:text-2xl font-black text-indigo-800 dark:text-indigo-300">
              {lang === 'ja' ? '🏫 学校たんけん・道案内 (4年生 U8)' : '🏫 School Map Navigator (Grade 4 U8)'}
            </h2>
            <span className="font-black text-indigo-600 dark:text-indigo-400 text-sm">
              {lang === 'ja' ? 'とくてん' : 'Score'}: {score}
            </span>
          </div>

          {/* MISSION BANNER WITH AUDIO */}
          <div className="bg-indigo-100 dark:bg-indigo-950/60 p-3.5 sm:p-4 rounded-3xl border-4 border-indigo-300 dark:border-indigo-700 flex items-center justify-between gap-3 shadow-sm">
            <div className="flex items-center gap-3 sm:gap-4">
              <span className="text-3xl sm:text-5xl select-none">🏫</span>
              <div>
                <div className="text-[11px] sm:text-xs font-black uppercase text-indigo-800 dark:text-indigo-300 tracking-wider">
                  {lang === 'ja' ? 'ミッション (もくてき):' : 'Mission:'}
                </div>
                <div className="text-lg sm:text-2xl md:text-3xl font-black text-indigo-950 dark:text-white">
                  "Excuse me. Where is the <span className="text-indigo-600 dark:text-indigo-400 underline decoration-indigo-300">{targetRoom.name}</span>?"
                </div>
                <div className="text-xs sm:text-sm text-indigo-700 dark:text-indigo-300 font-bold mt-1">
                  {lang === 'ja' ? (
                    <span className="flex flex-wrap items-center gap-1.5">
                      <span>「すみません、</span>
                      <ruby className="bg-white/80 dark:bg-slate-800/80 px-1.5 py-0.5 rounded shadow-sm text-indigo-900 dark:text-indigo-200">
                        {targetRoom.kanji}
                        <rt className="text-[10px] font-bold text-indigo-600 dark:text-indigo-400">{targetRoom.jaName}</rt>
                      </ruby>
                      <span>は どこですか？」</span>
                      <span className="text-indigo-900/80 dark:text-slate-300 text-xs ml-1 font-normal">• したの ボタンで あんない してね！</span>
                    </span>
                  ) : (
                    <span>Guide the student to the room using the directions below!</span>
                  )}
                </div>
              </div>
            </div>
            <button
              onClick={() => speakMission(targetRoom)}
              className="p-2.5 sm:p-3 bg-indigo-500 hover:bg-indigo-600 text-white rounded-2xl shadow active:scale-95 transition text-xl sm:text-2xl flex-shrink-0"
              title={lang === 'ja' ? 'おんせいを きく' : 'Hear Mission Speech'}
            >
              🔊
            </button>
          </div>

          {/* SCHOOL MAP GRID (ALL 8 ROOMS WITH CARD TIERS & NO LEAKED TEXT) */}
          <div className="grid grid-cols-4 gap-2.5 sm:gap-3.5 bg-white dark:bg-slate-900/90 p-3 sm:p-5 rounded-3xl border-4 border-indigo-200 dark:border-slate-700 shadow-lg">
            {rooms.map((r) => {
              const isPlayer = playerPos.x === r.x && playerPos.y === r.y;
              const isTarget = targetRoom.id === r.id;
              return (
                <div
                  key={r.id}
                  className={`h-36 sm:h-44 md:h-52 lg:h-60 rounded-2xl border-3 p-1.5 sm:p-2 flex flex-col justify-between relative transition-all duration-200 ${
                    isPlayer
                      ? `ring-4 ring-indigo-500 bg-indigo-50 dark:bg-indigo-950/70 shadow-xl scale-102 ${bump ? 'animate-bounce border-rose-500 ring-rose-400' : 'border-indigo-400'}`
                      : isTarget
                      ? 'ring-4 ring-amber-400 bg-amber-50/80 dark:bg-amber-950/50 border-amber-400 shadow-md'
                      : 'bg-gray-50 dark:bg-slate-800/80 border-gray-200 dark:border-slate-700'
                  }`}
                >
                  {/* FLOATING TARGET BADGE */}
                  {isTarget && (
                    <div className="absolute top-2 left-2 bg-amber-500 text-white text-[10px] sm:text-xs font-black px-2 py-0.5 rounded-full shadow z-20 animate-bounce">
                      {lang === 'ja' ? '🎯 もくてき' : '🎯 Target'}
                    </div>
                  )}

                  {/* FLOATING PLAYER BADGE WITH FACING ARROW */}
                  {isPlayer && (
                    <div className="absolute top-2 right-2 bg-indigo-600 text-white text-[10px] sm:text-xs font-black px-2.5 py-1 rounded-full shadow-lg flex items-center gap-1 z-20 animate-pulse">
                      <span>{lang === 'ja' ? '🚶 じぶん' : '🚶 Me'}</span>
                      <span className="text-xs sm:text-sm">{currentDir.arrow}</span>
                    </div>
                  )}

                  {/* ROOM FLASHCARD (RESPECTS CARD TIER: PIC ONLY, PIC+WORD, WORD ONLY) */}
                  <div className="w-full flex-1 flex items-center justify-center p-0.5">
                    {r.imgFile ? (
                      <CardView
                        card={{ imgFile: r.imgFile, en: r.name }}
                        tier={defaultTier}
                        showLabel={false}
                        size="auto"
                        className="w-full h-full border-0 shadow-none bg-transparent"
                      />
                    ) : (
                      <span className="text-3xl sm:text-5xl">{r.icon}</span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* CONTROLS ZONE */}
          <div className="bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-3xl border-3 border-indigo-100 dark:border-slate-700 shadow-md flex flex-col items-center gap-3">
            {/* MODE SWITCHER */}
            <div className="flex items-center gap-2 bg-indigo-50 dark:bg-slate-900 p-1 rounded-2xl border border-indigo-200 dark:border-slate-700 text-xs">
              <span className="text-indigo-900 dark:text-indigo-300 font-black px-2 hidden sm:inline">
                {lang === 'ja' ? 'うごかし方:' : 'Movement Mode:'}
              </span>
              <button
                onClick={() => setNavMode('walking')}
                className={`px-3 py-1.5 font-black rounded-xl transition ${
                  navMode === 'walking' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-800 dark:text-slate-300 hover:bg-indigo-100 dark:hover:bg-slate-800'
                }`}
                title="Pedagogical Turn & Go mode: 'Turn left', 'Turn right', 'Go straight'"
              >
                {lang === 'ja' ? '🧭 あるく (曲がる ＆ すすむ)' : '🧭 Walking (Turn & Go)'}
              </button>
              <button
                onClick={() => setNavMode('dpad')}
                className={`px-3 py-1.5 font-black rounded-xl transition ${
                  navMode === 'dpad' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-800 dark:text-slate-300 hover:bg-indigo-100 dark:hover:bg-slate-800'
                }`}
                title="Direct 4-way arrow controls"
              >
                {lang === 'ja' ? '🕹️ 矢印ボタン (上下左右)' : '🕹️ Direct D-Pad'}
              </button>
            </div>

            {navMode === 'walking' ? (
              /* WALKING TOUR: AUTHENTIC CURRICULUM CONTROLS */
              <div className="flex flex-col items-center gap-2.5 w-full max-w-md">
                <button
                  onClick={goStraight}
                  className="w-56 sm:w-64 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow-lg active:scale-95 transition text-base sm:text-lg flex items-center justify-center gap-2"
                >
                  <span className="text-xl">{currentDir.arrow}</span>
                  <span>{lang === 'ja' ? 'まっすぐ すすむ' : 'Go straight'}</span>
                </button>

                <div className="flex gap-3 sm:gap-4 w-full justify-center">
                  <button
                    onClick={turnLeft}
                    className="flex-1 max-w-[170px] py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-black rounded-2xl shadow-md active:scale-95 transition text-sm sm:text-base flex items-center justify-center gap-2"
                  >
                    <span className="text-lg">↰</span>
                    <span>{lang === 'ja' ? 'ひだりに まがる' : 'Turn left'}</span>
                  </button>
                  <button
                    onClick={turnRight}
                    className="flex-1 max-w-[170px] py-3 bg-indigo-500 hover:bg-indigo-600 text-white font-black rounded-2xl shadow-md active:scale-95 transition text-sm sm:text-base flex items-center justify-center gap-2"
                  >
                    <span>{lang === 'ja' ? 'みぎに まがる' : 'Turn right'}</span>
                    <span className="text-lg">↱</span>
                  </button>
                </div>

                <button
                  onClick={goBack}
                  className="w-48 sm:w-56 py-2 bg-indigo-100 hover:bg-indigo-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-indigo-900 dark:text-indigo-200 font-bold rounded-xl text-xs sm:text-sm active:scale-95 transition flex items-center justify-center gap-2"
                >
                  <span>{reverseDir.arrow}</span>
                  <span>{lang === 'ja' ? 'うしろへ もどる' : 'Go back'}</span>
                </button>
              </div>
            ) : (
              /* DIRECT D-PAD CONTROLS */
              <div className="flex flex-col items-center gap-2 w-full max-w-md">
                <button
                  onClick={() => attemptMove(0, -1, 0)}
                  className="w-48 sm:w-56 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow active:scale-95 transition text-sm sm:text-base"
                >
                  ⬆️ {lang === 'ja' ? 'うえ (Up)' : 'Up'}
                </button>
                <div className="flex gap-3 w-full justify-center">
                  <button
                    onClick={() => attemptMove(-1, 0, 3)}
                    className="w-36 sm:w-44 py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white font-black rounded-2xl shadow active:scale-95 transition text-sm sm:text-base"
                  >
                    ⬅️ {lang === 'ja' ? 'ひだり (Left)' : 'Left'}
                  </button>
                  <button
                    onClick={() => attemptMove(1, 0, 1)}
                    className="w-36 sm:w-44 py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white font-black rounded-2xl shadow active:scale-95 transition text-sm sm:text-base"
                  >
                    ➡️ {lang === 'ja' ? 'みぎ (Right)' : 'Right'}
                  </button>
                </div>
                <button
                  onClick={() => attemptMove(0, 1, 2)}
                  className="w-48 sm:w-56 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl shadow active:scale-95 transition text-sm sm:text-base"
                >
                  ⬇️ {lang === 'ja' ? 'した (Down)' : 'Down'}
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP ROUTER (ALL 12 GAMES CONNECTED) ---
    function App() {
      // Support URL parameter ?grade=1|2|3|4, falling back to localStorage memory or Grade 3
      const urlParams = new URLSearchParams(window.location.search);
      const urlGrade = parseInt(urlParams.get('grade'), 10);
      const savedGrade = parseInt(localStorage.getItem('letstry_last_grade'), 10);
      const initialGrade = (urlGrade >= 1 && urlGrade <= 4) ? urlGrade : ((savedGrade >= 1 && savedGrade <= 4) ? savedGrade : 3);

      const [grade, setGrade] = useState(initialGrade);
      const [unitId, setUnitId] = useState(() => {
        const u = initialGrade === 1 ? GRADE_1_UNITS : initialGrade === 2 ? GRADE_2_UNITS : initialGrade === 3 ? GRADE_3_UNITS : GRADE_4_UNITS;
        return (initialGrade <= 2 ? u[1]?.id : u[3]?.id) || u[0]?.id;
      });
      const [cardTier, setCardTier] = useState(initialGrade <= 2 ? 'picture_only' : 'picture_word');
      const [activeGameId, setActiveGameId] = useState(null);
      const [lang, setLang] = useState('en'); // 'en' | 'ja'
      const [darkMode, setDarkMode] = useState(false);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', darkMode);
      }, [darkMode]);

      const t = I18N[lang] || I18N.en;

      const getUnitsForGrade = (g) => {
        switch (g) {
          case 1: return GRADE_1_UNITS;
          case 2: return GRADE_2_UNITS;
          case 3: return GRADE_3_UNITS;
          case 4: default: return GRADE_4_UNITS;
        }
      };

      const currentUnits = getUnitsForGrade(grade);
      let activeUnit = currentUnits.find(u => u.id === unitId) || currentUnits[0];

      const handleSelectGrade = (g) => {
        setGrade(g);
        try { localStorage.setItem('letstry_last_grade', g); } catch(e){}
        const newUnits = getUnitsForGrade(g);
        if (g <= 2) {
          setCardTier('picture_only');
          setUnitId(newUnits[1]?.id || newUnits[0].id);
        } else {
          setCardTier('picture_word');
          setUnitId(newUnits[3]?.id || newUnits[0].id);
        }
        setActiveGameId(null);
      };

      const renderGame = () => {
        if (!activeGameId) {
          return (
            <ArcadeHub
              activeUnit={activeUnit}
              cardTier={cardTier}
              onChangeTier={setCardTier}
              onSelectGame={setActiveGameId}
              lang={lang}
              t={t}
            />
          );
        }
        const props = { unit: activeUnit, defaultTier: cardTier, lang, t, onBack: () => setActiveGameId(null) };

        switch (activeGameId) {
          case 'karuta':
            return <KarutaGame {...props} />;
          case 'speed_flash':
            return <FlashCardGame {...props} />;
          case 'timebomb':
            return <TimeBombGame {...props} />;
          case 'memory':
            return <MemoryGame {...props} />;
          case 'whats_missing':
            return <WhatsMissingGame {...props} />;
          case 'mystery_quiz':
            return <MysteryQuizGame {...props} />;
          case 'typhoon':
            return <TyphoonGame {...props} />;
          case 'bingo':
            return <BingoGame {...props} />;
          case 'musical_freeze':
            return <MusicalFreezeGame {...props} />;
          case 'fruit_parfait':
          case 'pizza_maker':
            return <ParfaitChefGame {...props} />;
          case 'monster_maker':
            return <MonsterLabGame {...props} />;
          case 'school_map':
            return <SchoolMapGame {...props} />;
          default:
            return (
              <ArcadeHub
                activeUnit={activeUnit}
                cardTier={cardTier}
                onChangeTier={setCardTier}
                onSelectGame={setActiveGameId}
                lang={lang}
                t={t}
              />
            );
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <Navbar
            grade={grade}
            onSelectGrade={handleSelectGrade}
            unitId={activeUnit.id}
            onSelectUnitId={setUnitId}
            currentUnits={currentUnits}
            cardTier={cardTier}
            onChangeTier={setCardTier}
            onHomeClick={() => setActiveGameId(null)}
            lang={lang}
            onToggleLang={() => setLang(l => l === 'en' ? 'ja' : 'en')}
            darkMode={darkMode}
            onToggleDarkMode={() => setDarkMode(d => !d)}
            t={t}
          />
          <main className="flex-1 w-full max-w-[1700px] mx-auto px-2 sm:px-4 md:px-6 py-2 sm:py-3 md:py-4 flex flex-col">
            {renderGame()}
          </main>
          <footer className="bg-white/80 dark:bg-slate-900/80 border-t border-amber-200 dark:border-slate-800 py-2.5 text-center text-xs text-gray-500 dark:text-slate-400">
            🎮 {t.title} • {t.officialBadge} • Universal Design Typography
          </footer>
        </div>
      );
    }

    // Mount DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
