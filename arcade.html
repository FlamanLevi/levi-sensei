    const { useState, useEffect, useRef } = React;

    // --- SOUND ENGINE (Web Audio API Synthesizer) ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSoundEffect(type) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.linearRampToValueAtTime(90, now + 0.25);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.exponentialRampToValueAtTime(750, now + 0.07);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'flip') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.setValueAtTime(460, now + 0.04);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'bell') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'fanfare') {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now + idx * 0.12);
            g.gain.setValueAtTime(0.25, now + idx * 0.12);
            g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.35);
            o.connect(g);
            g.connect(ctx.destination);
            o.start(now + idx * 0.12);
            o.stop(now + idx * 0.12 + 0.35);
          });
        }
      } catch (e) {
        console.warn('Audio error:', e);
      }
    }

    function playCardAudio(card) {
      if (!card) return;

      // 1. Cancel previous audio & clear pending end notification timers
      if (window.__currentArcadeAudio) {
        try {
          window.__currentArcadeAudio.pause();
          window.__currentArcadeAudio.currentTime = 0;
        } catch(e) {}
        window.__currentArcadeAudio = null;
      }
      if (window.__arcadeAudioTimer) {
        clearTimeout(window.__arcadeAudioTimer);
        window.__arcadeAudioTimer = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      window.dispatchEvent(new CustomEvent('card-audio-start', { detail: card }));

      const notifyEnd = (delay = 100) => {
        if (window.__arcadeAudioTimer) clearTimeout(window.__arcadeAudioTimer);
        window.__arcadeAudioTimer = setTimeout(() => {
          window.__arcadeAudioTimer = null;
          window.dispatchEvent(new CustomEvent('card-audio-end', { detail: card }));
        }, delay);
      };

      // 2. Resolve studio sound file
      let soundFile = null;
      const cleanId = (card.id || '').toLowerCase().replace(/^(small_|letter_)/, '');
      const cleanEn = (card.en || '').toLowerCase().replace(/\s*\([^)]*\)/g, '').trim();

      // Check alphabet first: maps both uppercase and lowercase to authentic studio letters
      if ((card.isLetter && card.letter) || (card.id && card.id.startsWith('small_')) || (cleanEn.length === 1 && cleanEn >= 'a' && cleanEn <= 'z')) {
        const char = (card.letter || cleanEn || cleanId).toLowerCase()[0];
        if (char >= 'a' && char <= 'z') {
          soundFile = `dic_3_card_${char}_${2068 + (char.charCodeAt(0) - 97)}.mp3`;
        }
      }

      // Check AUDIO_LOOKUP table
      if (!soundFile && AUDIO_LOOKUP[card.id]) soundFile = AUDIO_LOOKUP[card.id];
      if (!soundFile && AUDIO_LOOKUP[cleanId]) soundFile = AUDIO_LOOKUP[cleanId];
      if (!soundFile && AUDIO_LOOKUP[cleanEn]) soundFile = AUDIO_LOOKUP[cleanEn];

      // Fallback to card.imgFile standard convention
      if (!soundFile && card.imgFile) {
        soundFile = card.imgFile.replace(/_\d+_[a-z]+\.png$/, '.mp3');
      }

      if (soundFile) {
        const paths = [
          `./resources/app/app/__media/dictionary/dic_card_data_sound/${soundFile}`,
          `file:///C:/Users/二子玉川小学校学校代表/Documents/Let's Try Merged/resources/app/app/__media/dictionary/dic_card_data_sound/${soundFile}`,
          `file:///C:/Users/二子玉川小学校学校代表/Documents/Github/letstry1/resources/app/app/__media/dictionary/dic_card_data_sound/${soundFile}`,
          `file:///C:/Users/二子玉川小学校学校代表/Documents/Github/letstry2/resources/app/app/__media/dictionary/dic_card_data_sound/${soundFile}`
        ];

        let pathIdx = 0;
        const tryNextAudio = () => {
          if (pathIdx >= paths.length) {
            // All sound paths failed -> graceful SpeechSynthesis fallback
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const utter = new SpeechSynthesisUtterance(card.en.replace(/\s*\([^)]*\)/g, ''));
              utter.lang = 'en-US';
              utter.rate = 0.9;
              utter.onend = () => notifyEnd(100);
              utter.onerror = () => notifyEnd(100);
              window.speechSynthesis.speak(utter);
            } else {
              notifyEnd(800);
            }
            return;
          }

          const audio = new Audio(paths[pathIdx++]);
          window.__currentArcadeAudio = audio;
          audio.onended = () => {
            window.__currentArcadeAudio = null;
            notifyEnd(100);
          };
          audio.onerror = () => {
            tryNextAudio();
          };
          audio.play().catch(() => {
            tryNextAudio();
          });
        };

        tryNextAudio();
        return;
      }

      // Final fallback if no sound file can be determined
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(card.en.replace(/\s*\([^)]*\)/g, ''));
        utter.lang = 'en-US';
        utter.rate = 0.9;
        utter.onend = () => notifyEnd(100);
        utter.onerror = () => notifyEnd(100);
        window.speechSynthesis.speak(utter);
      } else {
        notifyEnd(800);
      }
    }

    // --- CARD VARIANT RESOLVER & CARD VIEW ---
    function getCardVariantFile(imgFile, tier = 'picture_word') {
      if (!imgFile) return null;
      if (tier === 'picture_only') {
        return imgFile.replace(/_\d+_[a-z]+\.png$/, '_1_c.png');
      }
      if (tier === 'word_only') {
        return imgFile.replace(/_\d+_[a-z]+\.png$/, '_5_e.png');
      }
      // default: 'picture_word' -> illustration + English text label
      return imgFile.replace(/_\d+_[a-z]+\.png$/, '_1_ce.png');
    }

      const targetFile = card?.imgFile ? getCardVariantFile(card.imgFile, tier) : null;

      const candidatePaths = [];

        if (fallbackFile && fallbackFile !== targetFile) {
          candidatePaths.push(`./resources/app/app/__media/dictionary/dic_card_data_image/${fallbackFile}`);
          candidatePaths.push(`file:///C:/Users/二子玉川小学校学校代表/Documents/Let's Try Merged/resources/app/app/__media/dictionary/dic_card_data_image/${fallbackFile}`);
          candidatePaths.push(`file:///C:/Users/二子玉川小学校学校代表/Documents/Github/letstry1/resources/app/app/__media/dictionary/dic_card_data_image/${fallbackFile}`);
          candidatePaths.push(`file:///C:/Users/二子玉川小学校学校代表/Documents/Github/letstry2/resources/app/app/__media/dictionary/dic_card_data_image/${fallbackFile}`);
        }
      }

      const currentSrc = candidatePaths[pathIdx] || null;

      const sizeClasses = {
        sm: 'w-24 h-28 sm:w-28 sm:h-32 text-xs',

        auto: 'w-full h-full text-base',
        full: 'w-full h-full text-base',

      const handleCardClick = (e) => {
        if (enableAudio) {
          playCardAudio(card);
        }
        if (onClick) onClick(e);

      // When official card image is loaded, the card itself already contains the artwork,
      // English text (in picture_word), or word flashcard (in word_only).
      // Hide the redundant extra text box below the card whenever an image is loaded,
      // and never show text in 'picture_only' mode. Only display label as a fallback when no image exists (!currentSrc).
      const shouldShowLabel = showLabel && !currentSrc && tier !== 'picture_only';

      // Optical zoom for picture_only mode:
      // Because _1_c.png has large canvas padding where text was erased, zoom by ~25% so the illustration fills the card prominently!
      const imgScaleClass = tier === 'picture_only'
        ? 'scale-125 md:scale-130 group-hover:scale-135'

      return (
        <div
          onClick={handleCardClick}
          className={`group relative ${sizeClasses} ${className} rounded-2xl bg-white dark:bg-slate-800 border-2 border-amber-200 dark:border-slate-700 shadow-md p-2 flex flex-col items-center justify-between transition-all duration-200 select-none cursor-pointer active:scale-95`}

          <div className="flex-1 w-full flex items-center justify-center overflow-hidden relative">

              <img
                src={currentSrc}
                alt={card.en}
                onError={() => setPathIdx(i => i + 1)}
                className={`max-w-full max-h-full object-contain pointer-events-none drop-shadow-sm rounded-lg transition-transform duration-200 ${imgScaleClass}`}
              />
            ) : (
              <div className="flex flex-col items-center justify-center">
                <span className="text-5xl sm:text-6xl">{card.icon || '🎴'}</span>

                  <span className="text-4xl sm:text-5xl font-black text-indigo-700 dark:text-indigo-400 mt-1">{card.letter}</span>

              </div>

          </div>
          {shouldShowLabel && (
            <div className="w-full text-center mt-1 border-t border-amber-100 dark:border-slate-700 pt-1 flex items-center justify-center gap-1">

    // --- GAME 1: KARUTA BATTLE & CLASSROOM CALLER ---
    function KarutaGame({ unit, defaultTier = 'picture_only', lang = 'en', onBack }) {
      const cards = unit.cards || [];
      const [gameMode, setGameMode] = useState('class_team'); // 'class_team' (TV Battle) | 'desk_caller' (Desk Karuta) | 'split_2p' (iPad touch)
      const [layoutMode, setLayoutMode] = useState('grid'); // 'grid' (3x2) vs 'row' (6x1)
      const [gameTier, setGameTier] = useState(defaultTier || 'picture_only');
      const [pacing, setPacing] = useState(unit?.grade <= 2 ? 2600 : 1800); // 1200 | 1800 | 2600

      // Team battle states (Rows 1-6)
      const [teamCount, setTeamCount] = useState(2); // 1 (Solo/All) | 2 | 3 | 4 | 5 | 6
      const [activeTeamIndex, setActiveTeamIndex] = useState(0);
      const [teamScores, setTeamScores] = useState([0, 0, 0, 0, 0, 0]);

      // Round & Selection states
      const [transitioning, setTransitioning] = useState(false);
      const [feedbackCardId, setFeedbackCardId] = useState(null);
      const [feedbackStatus, setFeedbackStatus] = useState(null); // 'correct' | 'wrong'
      const [targetCard, setTargetCard] = useState(null);
      const [pool, setPool] = useState([]);
      const [scoreSolo, setScoreSolo] = useState(0);
      const [scoreP1, setScoreP1] = useState(0);
      const [scoreP2, setScoreP2] = useState(0);
      const [isCalling, setIsCalling] = useState(false);
      const [showWord, setShowWord] = useState(false); // Mystery listen mode

      // Desk Auto-Caller states (Hands on head -> Listen -> 3s countdown -> SLAP! -> Reveal)
      const [deskStage, setDeskStage] = useState('listening'); // 'listening' | 'countdown' | 'slap' | 'revealed'
      const [deskCountdown, setDeskCountdown] = useState(3);
      const [autoAdvance, setAutoAdvance] = useState(false);

      const transitionTimerRef = useRef(null);
      const audioTimerRef = useRef(null);
      const deskCountdownTimerRef = useRef(null);
      const deskAutoAdvanceTimerRef = useRef(null);

      useEffect(() => {
        if (unit?.grade <= 2) {
          setPacing(2600);
        }
      }, [unit]);

      useEffect(() => {
        return () => {
          if (transitionTimerRef.current) clearTimeout(transitionTimerRef.current);
          if (audioTimerRef.current) clearTimeout(audioTimerRef.current);
          if (deskCountdownTimerRef.current) clearInterval(deskCountdownTimerRef.current);
          if (deskAutoAdvanceTimerRef.current) clearTimeout(deskAutoAdvanceTimerRef.current);
        };
      }, []);

      useEffect(() => {
        const onStart = () => setIsCalling(true);
        const onEnd = () => setIsCalling(false);
        window.addEventListener('card-audio-start', onStart);
        window.addEventListener('card-audio-end', onEnd);
        return () => {
          window.removeEventListener('card-audio-start', onStart);
          window.removeEventListener('card-audio-end', onEnd);
        };
      }, []);

      const nextRound = () => {
        if (!cards.length) return;
        if (transitionTimerRef.current) clearTimeout(transitionTimerRef.current);
        if (audioTimerRef.current) clearTimeout(audioTimerRef.current);
        if (deskCountdownTimerRef.current) clearInterval(deskCountdownTimerRef.current);
        if (deskAutoAdvanceTimerRef.current) clearTimeout(deskAutoAdvanceTimerRef.current);

        const shuffled = [...cards].sort(() => 0.5 - Math.random());
        const target = shuffled[0];
        const roundCards = shuffled.slice(0, Math.min(6, cards.length)).sort(() => 0.5 - Math.random());
        if (!roundCards.some(c => c.id === target.id)) {
          roundCards[Math.floor(Math.random() * roundCards.length)] = target;
        }

        setTargetCard(target);
        setPool(roundCards);
        setFeedbackCardId(null);
        setFeedbackStatus(null);
        setTransitioning(false);
        playSoundEffect('bell');

        if (gameMode === 'desk_caller') {
          setDeskStage('listening');
          setDeskCountdown(3);
          if (audioTimerRef.current) clearTimeout(audioTimerRef.current);
          audioTimerRef.current = setTimeout(() => {
            playCardAudio(target);
            setTimeout(() => {
              setDeskStage('countdown');
              let remaining = 3;
              setDeskCountdown(3);
              if (deskCountdownTimerRef.current) clearInterval(deskCountdownTimerRef.current);
              deskCountdownTimerRef.current = setInterval(() => {
                remaining -= 1;
                if (remaining > 0) {
                  setDeskCountdown(remaining);
                  playSoundEffect('pop');
                } else {
                  clearInterval(deskCountdownTimerRef.current);
                  setDeskStage('slap');
                  playSoundEffect('fanfare');
                  setTimeout(() => {
                    setDeskStage('revealed');
                    playSoundEffect('correct');
                    try { confetti({ particleCount: 50, spread: 60 }); } catch(e){}
                    playCardAudio(target);
                    if (autoAdvance) {
                      deskAutoAdvanceTimerRef.current = setTimeout(() => {
                        nextRound();
                      }, 4500);
                    }
                  }, 1100);
                }
              }, 900);
            }, 1100);
          }, 400);
        } else {
          if (audioTimerRef.current) clearTimeout(audioTimerRef.current);
          audioTimerRef.current = setTimeout(() => playCardAudio(target), 400);
        }
      };

      useEffect(() => {
        nextRound();
      }, [unit, gameMode]);

      const handleTap = (card, player = 1) => {
        if (!targetCard || transitioning) return;

        if (card.id === targetCard.id) {
          // --- CORRECT CARD TAPPED ---
          setTransitioning(true);
          setFeedbackCardId(card.id);
          setFeedbackStatus('correct');
          playSoundEffect('correct');
          try { confetti({ particleCount: 60, spread: 60, origin: { y: 0.6 } }); } catch(e){}

          if (gameMode === 'split_2p') {
            if (player === 1) setScoreP1(s => s + 100);
            else setScoreP2(s => s + 100);
          } else if (teamCount > 1) {
            setTeamScores(prev => {
              const next = [...prev];
              next[activeTeamIndex] = (next[activeTeamIndex] || 0) + 100;
              return next;
            });
            // Winning team gets bonus turn! activeTeamIndex does NOT advance.
          } else {
            setScoreSolo(s => s + 100);
          }

          if (audioTimerRef.current) clearTimeout(audioTimerRef.current);
          audioTimerRef.current = setTimeout(() => {
            playCardAudio(card);
          }, 280);

          if (transitionTimerRef.current) clearTimeout(transitionTimerRef.current);
          transitionTimerRef.current = setTimeout(() => {
            nextRound();
          }, pacing);
        } else {
          // --- INCORRECT CARD TAPPED ---
          setFeedbackCardId(card.id);
          setFeedbackStatus('wrong');
          playSoundEffect('wrong');
          playCardAudio(card);

          if (gameMode === 'class_team' && teamCount > 1) {
            // Wrong answer passes turn to next row/team
            setActiveTeamIndex(prev => (prev + 1) % teamCount);
          }

          setTimeout(() => {
            setFeedbackCardId(prev => prev === card.id ? null : prev);
            setFeedbackStatus(prev => prev === 'wrong' ? null : prev);
          }, 700);
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

          // Spacebar: replay audio or advance desk caller
          if (e.code === 'Space') {
            e.preventDefault();
            if (gameMode === 'desk_caller') {
              if (deskStage === 'revealed') {
                nextRound();
              } else {
                playCardAudio(targetCard);
              }
            } else {
              playCardAudio(targetCard);
            }
            return;
          }

          // PageDown / ArrowRight: next round / next card
          if (e.code === 'PageDown' || e.code === 'ArrowRight') {
            e.preventDefault();
            nextRound();
            return;
          }

          // Number keys 1-6 for card selection
          if (gameMode !== 'desk_caller' && gameMode !== 'split_2p') {
            let num = -1;
            if (e.code.startsWith('Digit')) {
              num = parseInt(e.code.replace('Digit', ''), 10);
            } else if (e.code.startsWith('Numpad')) {
              num = parseInt(e.code.replace('Numpad', ''), 10);
            } else if (e.key >= '1' && e.key <= '6') {
              num = parseInt(e.key, 10);
            }
            if (num >= 1 && num <= pool.length) {
              e.preventDefault();
              handleTap(pool[num - 1], 1);
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);

    ];

    const MEMORY_TEAMS = CLASSROOM_TEAMS;

    function MemoryGame({ unit, defaultTier = 'picture_word', lang = 'en', onBack }) {
      const cards = unit.cards || [];
      const isG1orG2 = unit?.grade <= 2;
      const [matchMode, setMatchMode] = useState(isG1orG2 ? 'same_pair' : 'match_pic_word'); // 'match_pic_word' | 'same_pair'
      const [gameTier, setGameTier] = useState(isG1orG2 ? 'picture_only' : (defaultTier || 'picture_word'));
      const [cardLabelMode, setCardLabelMode] = useState('kanji'); // 'kanji' | 'number' | 'letter' | 'classic'
      const [pairCount, setPairCount] = useState(6); // 4 (8 cards) | 6 (12 cards)
      const [teamCount, setTeamCount] = useState(2); // 1 (Solo) | 2 | 3 | 4 | 5 | 6
      const [activeTeamIndex, setActiveTeamIndex] = useState(0);
      const [teamScores, setTeamScores] = useState([0, 0, 0, 0, 0, 0]);
      const [streak, setStreak] = useState(0);
      const [deck, setDeck] = useState([]);
      const [flipped, setFlipped] = useState([]);
      const [matched, setMatched] = useState([]);
      const [matchedBy, setMatchedBy] = useState({}); // { [cardId]: teamIndex }
      const [score, setScore] = useState(0);
      const [peekCountdown, setPeekCountdown] = useState(null); // null | number
      const [speakingCheck, setSpeakingCheck] = useState(true);
      const [awaitingSpeech, setAwaitingSpeech] = useState(false);
      const [teamHelpActive, setTeamHelpActive] = useState(false);
      const peekTimerRef = useRef(null);
      const flipTimerRef = useRef(null);

      useEffect(() => {
        if (unit?.grade <= 2) {
          setMatchMode('same_pair');
          setGameTier('picture_only');
        }
      }, [unit]);

      useEffect(() => {
        return () => {
          if (peekTimerRef.current) clearInterval(peekTimerRef.current);
          if (flipTimerRef.current) clearTimeout(flipTimerRef.current);
        };
      }, []);

      const setupDeck = (newPairCount = pairCount, newMatchMode = matchMode, newTier = gameTier) => {
        if (peekTimerRef.current) clearInterval(peekTimerRef.current);
        if (flipTimerRef.current) clearTimeout(flipTimerRef.current);
        setPeekCountdown(null);
        setAwaitingSpeech(false);
        setTeamHelpActive(false);
        const count = newPairCount || pairCount;
        const mode = newMatchMode || matchMode;
        const tier = newTier || gameTier;
        const sample = [...cards].sort(() => 0.5 - Math.random()).slice(0, count);
        const pairs = [];
        sample.forEach((card, idx) => {
          if (mode === 'match_pic_word') {
            pairs.push({ key: `${card.id}-pic`, card, id: idx, tier: 'picture_only' });
            pairs.push({ key: `${card.id}-word`, card, id: idx, tier: 'word_only' });
          } else {
            pairs.push({ key: `${card.id}-a`, card, id: idx, tier });
            pairs.push({ key: `${card.id}-b`, card, id: idx, tier });
          }
        });
        setDeck(pairs.sort(() => 0.5 - Math.random()));
        setFlipped([]);
        setMatched([]);
        setMatchedBy({});
        setScore(0);
        setActiveTeamIndex(0);
        setTeamScores([0, 0, 0, 0, 0, 0]);
        setStreak(0);
      };

      useEffect(() => {
        setupDeck(pairCount, matchMode, gameTier);
      }, [unit, matchMode, gameTier, pairCount]);

      const startSneakPeek = (seconds) => {
        if (peekCountdown !== null) return;
        if (flipTimerRef.current) clearTimeout(flipTimerRef.current);
        setFlipped([]);
        setAwaitingSpeech(false);
        setTeamHelpActive(false);
        playSoundEffect('bell');
        setPeekCountdown(seconds);
        let remaining = seconds;
        if (peekTimerRef.current) clearInterval(peekTimerRef.current);
        peekTimerRef.current = setInterval(() => {
          remaining -= 1;
          if (remaining > 0) {
            setPeekCountdown(remaining);
            playSoundEffect('flip');
          } else {
            clearInterval(peekTimerRef.current);
            peekTimerRef.current = null;
            setPeekCountdown(null);
            playSoundEffect('bell');
          }
        }, 1000);
      };

      const cancelSneakPeek = () => {
        if (peekTimerRef.current) clearInterval(peekTimerRef.current);
        peekTimerRef.current = null;
        setPeekCountdown(null);
        playSoundEffect('bell');
      };

      const handleSpeechApproved = () => {
        if (!awaitingSpeech || flipped.length === 0) return;
        const firstCardIdx = flipped[0];
        const card = deck[firstCardIdx]?.card;
        playSoundEffect('correct');
        if (card) {
          setTimeout(() => {
            playCardAudio(card);
          }, 200);
        }
        setAwaitingSpeech(false);
        setTeamHelpActive(false);
      };

      const handleCardClick = (idx) => {
        if (peekCountdown !== null) return;
        if (!deck[idx] || matched.includes(deck[idx].id)) return;

        let currentFlipped = flipped;
        // Snappy click-through: if 2 mismatched cards are showing, clicking any card immediately clears them and advances turn!
        if (currentFlipped.length === 2) {
          if (flipTimerRef.current) clearTimeout(flipTimerRef.current);
          currentFlipped = [];
          setFlipped([]);
          if (teamCount > 1) {
            setActiveTeamIndex(prev => (prev + 1) % teamCount);
          }
        }

        // If awaiting speech for Card 1:
        if (awaitingSpeech) {
          // Touching / clicking Card 1 again acts as "Good Job / 言えた！" approval!
          if (currentFlipped.includes(idx)) {
            handleSpeechApproved();
          }
          return;
        }

        if (currentFlipped.includes(idx)) return;

        playSoundEffect('flip');
        const newFlipped = [...currentFlipped, idx];
        setFlipped(newFlipped);

        if (newFlipped.length === 1) {
          if (speakingCheck) {
            setAwaitingSpeech(true);
            setTeamHelpActive(false);
          } else {
            playCardAudio(deck[idx].card);
          }
          return;
        }

        if (newFlipped.length === 2) {
          playCardAudio(deck[idx].card);
          const card1 = deck[newFlipped[0]];
          const card2 = deck[newFlipped[1]];
          if (card1.id === card2.id) {
            // MATCH!
            playSoundEffect('correct');
            setMatched(prev => [...prev, card1.id]);
            setMatchedBy(prev => ({ ...prev, [card1.id]: activeTeamIndex }));
            setScore(s => s + 100);
            setStreak(s => s + 1);
            setFlipped([]);

            if (teamCount > 1) {
              setTeamScores(prev => {
                const next = [...prev];
                next[activeTeamIndex] = (next[activeTeamIndex] || 0) + 1;
                return next;
              });
              // Team gets bonus turn! activeTeamIndex does NOT change!
            }

            setTimeout(() => {
              playCardAudio(card1.card);
            }, 250);

            if (matched.length + 1 === pairCount) {
              playSoundEffect('fanfare');
              try { confetti({ particleCount: 80, spread: 70 }); } catch(e){}
            }
          } else {
            // MISMATCH
            playSoundEffect('wrong');
            setStreak(0);
            flipTimerRef.current = setTimeout(() => {
              setFlipped([]);
              if (teamCount > 1) {
                setActiveTeamIndex(prev => (prev + 1) % teamCount);
              }
            }, 900);
          }
        }
      };

      // --- KEYBOARD SHORTCUTS FOR TEACHER ON LAPTOP ---
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

          // Spacebar: Approve speech if awaiting, or instantly clear mismatched cards
          if (e.code === 'Space') {
            e.preventDefault();
            if (awaitingSpeech) {
              handleSpeechApproved();
            } else if (flipped.length === 2) {
              if (flipTimerRef.current) clearTimeout(flipTimerRef.current);
              setFlipped([]);
              if (teamCount > 1) {
                setActiveTeamIndex(prev => (prev + 1) % teamCount);
              }
            }
            return;
          }

          // Number keys 1-9, 0 (10), - (11), = (12)
          let num = -1;
          if (e.code.startsWith('Digit')) {
            const digit = parseInt(e.code.replace('Digit', ''), 10);
            num = digit === 0 ? 10 : digit;
          } else if (e.code.startsWith('Numpad')) {
            const digit = parseInt(e.code.replace('Numpad', ''), 10);
            num = digit === 0 ? 10 : digit;
          } else if (e.key >= '1' && e.key <= '9') {
            num = parseInt(e.key, 10);
          } else if (e.key === '0') {
            num = 10;
          } else if (e.key === '-' || e.code === 'Minus') {
            num = 11;
          } else if (e.key === '=' || e.code === 'Equal') {
            num = 12;
          } else if (cardLabelMode === 'letter' && e.code.startsWith('Key')) {
            const charCode = e.code.replace('Key', '').charCodeAt(0);
            if (charCode >= 65 && charCode <= 65 + 15) {
              num = charCode - 65 + 1;
            }
          }

          if (num >= 1 && num <= deck.length) {
            e.preventDefault();
            handleCardClick(num - 1);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [awaitingSpeech, flipped, deck, teamCount, activeTeamIndex, cardLabelMode, peekCountdown, matched]);

      const currentTeam = MEMORY_TEAMS[activeTeamIndex] || MEMORY_TEAMS[0];
      const isGameOver = matched.length === pairCount && pairCount > 0;

      return (
        <div className="w-full max-w-[1650px] mx-auto flex-1 flex flex-col justify-between space-y-3 sm:space-y-4 md:space-y-5">
          {/* Top Control Bar */}
          <div className="flex flex-wrap items-center justify-between bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl shadow border-2 border-indigo-200 dark:border-slate-700 gap-2 sm:gap-3">
            <button onClick={onBack} className="text-gray-500 dark:text-slate-400 hover:text-indigo-700 dark:hover:text-indigo-300 font-bold text-xs sm:text-sm px-2.5 py-1 rounded-lg">
              {lang === 'ja' ? '← もどる' : '← Back'}
            </button>
            <h2 className="text-xl sm:text-2xl font-black text-indigo-800 dark:text-indigo-300">
              {lang === 'ja' ? '🃏 えあわせ・神経衰弱' : '🃏 Concentration'}
            </h2>

            <div className="flex flex-wrap items-center gap-2">
              {/* Match Mode */}
              <div className="flex bg-indigo-50 dark:bg-slate-800 p-1 rounded-xl border border-indigo-200 dark:border-slate-700 text-xs">
                <button
                  onClick={() => setMatchMode('match_pic_word')}
                  className={`px-2.5 py-1 rounded-lg font-bold transition ${matchMode === 'match_pic_word' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-800 dark:text-indigo-300'}`}
                  title={lang === 'ja' ? 'チャレンジ: 絵カードと 単語カードを ペアにする' : 'Challenge: Match Picture Card to Word Card!'}
                >
                  {lang === 'ja' ? '🔀 え ↔ ことば' : '🔀 Pic ↔ Word'}
                </button>
                <button
                  onClick={() => setMatchMode('same_pair')}
                  className={`px-2.5 py-1 rounded-lg font-bold transition ${matchMode === 'same_pair' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-800 dark:text-indigo-300'}`}
                  title={lang === 'ja' ? 'おなじ カードを ペアにする' : 'Standard: Match identical cards'}
                >
                  {lang === 'ja' ? '👯 おなじペア' : '👯 Pairs'}
                </button>
              </div>

              {/* Tier selector for same_pair */}
              {matchMode === 'same_pair' && (
                <div className="flex bg-gray-100 dark:bg-slate-800 p-1 rounded-xl text-xs border border-gray-200 dark:border-slate-700">
                  <button
                    onClick={() => setGameTier('picture_only')}
                    className={`px-2 py-0.5 rounded font-bold ${gameTier === 'picture_only' ? 'bg-white dark:bg-slate-700 shadow text-gray-800 dark:text-white' : 'text-gray-500 dark:text-slate-400'}`}
                  >
                    🎨 {lang === 'ja' ? '絵' : 'Pic'}
                  </button>
                  <button
                    onClick={() => setGameTier('picture_word')}
                    className={`px-2 py-0.5 rounded font-bold ${gameTier === 'picture_word' ? 'bg-white dark:bg-slate-700 shadow text-gray-800 dark:text-white' : 'text-gray-500 dark:text-slate-400'}`}
                  >
                    🖼️ {lang === 'ja' ? '絵＋文字' : 'Pic+Word'}
                  </button>
                  <button
                    onClick={() => setGameTier('word_only')}
                    className={`px-2 py-0.5 rounded font-bold ${gameTier === 'word_only' ? 'bg-white dark:bg-slate-700 shadow text-gray-800 dark:text-white' : 'text-gray-500 dark:text-slate-400'}`}
                  >
                    🔤 {lang === 'ja' ? '文字' : 'Word'}
                  </button>
                </div>
              )}

              {/* Card Label Mode */}
              <div className="flex bg-indigo-50 dark:bg-slate-800 p-1 rounded-xl border border-indigo-200 dark:border-slate-700 text-xs items-center gap-0.5">
                <span className="text-[10px] sm:text-xs font-black text-indigo-700 dark:text-indigo-300 px-1">
                  {lang === 'ja' ? '番号:' : 'Label:'}
                </span>
                <button
                  onClick={() => setCardLabelMode('kanji')}
                  className={`px-2 py-0.5 rounded-lg font-bold transition ${cardLabelMode === 'kanji' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-800 dark:text-indigo-300'}`}
                  title={lang === 'ja' ? '漢字の数字 (一、二、三...)' : 'Kanji Numbers (一, 二, 三...)'}
                >
                  🎴 一二三
                </button>
                <button
                  onClick={() => setCardLabelMode('number')}
                  className={`px-2 py-0.5 rounded-lg font-bold transition ${cardLabelMode === 'number' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-800 dark:text-indigo-300'}`}
                  title={lang === 'ja' ? 'すうじ (1, 2, 3...)' : 'Numbers (1, 2, 3...)'}
                >
                  🔢 123
                </button>
                <button
                  onClick={() => setCardLabelMode('letter')}
                  className={`px-2 py-0.5 rounded-lg font-bold transition ${cardLabelMode === 'letter' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-800 dark:text-indigo-300'}`}
                  title={lang === 'ja' ? 'アルファベット (A, B, C...)' : 'Alphabet (A, B, C...)'}
                >
                  🔤 ABC
                </button>
                <button
                  onClick={() => setCardLabelMode('classic')}
                  className={`px-1.5 py-0.5 rounded-lg font-bold transition ${cardLabelMode === 'classic' ? 'bg-indigo-600 text-white shadow' : 'text-indigo-800 dark:text-indigo-300'}`}
                  title={lang === 'ja' ? 'はてな (❓)' : 'Mystery (❓)'}
                >
                  ❓
                </button>
              </div>

              {/* Pair Count Toggle (4 pairs 8 cards vs 6 pairs 12 cards) */}
              <div className="flex bg-indigo-50 dark:bg-slate-800 p-1 rounded-xl border border-indigo-200 dark:border-slate-700 text-xs items-center gap-0.5">
                <span className="text-[10px] sm:text-xs font-black text-indigo-700 dark:text-indigo-300 px-1">
                  {lang === 'ja' ? '枚数:' : 'Cards:'}
                </span>
                <button
                  onClick={() => setPairCount(4)}
                  className={`px-2 py-0.5 rounded-lg font-bold transition ${pairCount === 4 ? 'bg-indigo-600 text-white shadow' : 'text-indigo-800 dark:text-indigo-300'}`}
                  title={lang === 'ja' ? 'スピード勝負: 4ペア (8枚)' : 'Fast round: 4 pairs (8 cards)'}
                >
                  ⚡ 4ペア (8枚)
                </button>
                <button
                  onClick={() => setPairCount(6)}
                  className={`px-2 py-0.5 rounded-lg font-bold transition ${pairCount === 6 ? 'bg-indigo-600 text-white shadow' : 'text-indigo-800 dark:text-indigo-300'}`}
                  title={lang === 'ja' ? '標準: 6ペア (12枚)' : 'Standard round: 6 pairs (12 cards)'}
                >
                  🎯 6ペア (12枚)
                </button>
              </div>

              {/* Sneak Peek Buttons (3s and 5s) */}
              <div className="flex bg-amber-50 dark:bg-amber-950/40 p-1 rounded-xl border border-amber-300 dark:border-amber-700 text-xs items-center gap-1">
                <span className="text-[10px] sm:text-xs font-black text-amber-800 dark:text-amber-300 px-1">
                  👀 {lang === 'ja' ? 'チラ見せ:' : 'Peek:'}
                </span>
                <button
                  onClick={() => startSneakPeek(3)}
                  disabled={peekCountdown !== null}
                  className="px-2 py-0.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold rounded-lg shadow-sm disabled:opacity-50"
                  title={lang === 'ja' ? '3秒間 全てのカードをチラ見せ！' : 'Sneak peek all cards for 3 seconds!'}
                >
                  3秒
                </button>
                <button
                  onClick={() => startSneakPeek(5)}
                  disabled={peekCountdown !== null}
                  className="px-2 py-0.5 bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-bold rounded-lg shadow-sm disabled:opacity-50"
                  title={lang === 'ja' ? '5秒間 全てのカードをチラ見せ！' : 'Sneak peek all cards for 5 seconds!'}
                >
                  5秒
                </button>
              </div>

              {/* Speaking Check Toggle */}
              <div className="flex bg-indigo-50 dark:bg-slate-800 p-1 rounded-xl border border-indigo-200 dark:border-slate-700 text-xs items-center gap-0.5">
                <button
                  onClick={() => {
                    setSpeakingCheck(prev => {
                      const next = !prev;
                      if (!next) {
                        setAwaitingSpeech(false);
                        setTeamHelpActive(false);
                      }
                      return next;
                    });
                  }}
                  className={`px-2.5 py-1 rounded-lg font-black transition flex items-center gap-1 ${
                    speakingCheck
                      ? 'bg-emerald-600 text-white shadow ring-2 ring-emerald-400'
                      : 'text-indigo-800 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-slate-700'
                  }`}
                  title={
                    lang === 'ja'
                      ? 'スピーク・チェック: 1枚目のカードを開いたら、英語で言ってから2枚目を開くモード'
                      : 'Speaking Check: Say Card 1 in English before unlocking Card 2'
                  }
                >
                  <span>🎤</span>
                  <span>{lang === 'ja' ? `スピーク: ${speakingCheck ? 'ON' : 'OFF'}` : `Speaking: ${speakingCheck ? 'ON' : 'OFF'}`}</span>
                </button>
              </div>

              {/* Team Count Selector (1 to 6) */}
              <div className="flex bg-indigo-50 dark:bg-slate-800 p-1 rounded-xl border border-indigo-200 dark:border-slate-700 text-xs items-center gap-1">
                <span className="text-[10px] sm:text-xs font-black text-indigo-700 dark:text-indigo-300 px-1">
                  👥 {lang === 'ja' ? '対戦:' : 'Mode:'}
                </span>
                <select
                  value={teamCount}
                  onChange={(e) => {
                    setTeamCount(Number(e.target.value));
                    setActiveTeamIndex(0);
                    setStreak(0);
                    setTeamScores([0, 0, 0, 0, 0, 0]);
                    setMatchedBy({});
                    setAwaitingSpeech(false);
                    setTeamHelpActive(false);
                  }}
                  className="bg-white dark:bg-slate-700 text-indigo-900 dark:text-indigo-200 font-bold px-2 py-0.5 rounded-lg border border-indigo-200 dark:border-slate-600 text-xs cursor-pointer"
                >
                  <option value={1}>{lang === 'ja' ? '👤 1人 (スコア制)' : '👤 Solo Score'}</option>
                  <option value={2}>{lang === 'ja' ? '👥 2チーム (赤 vs 青)' : '👥 2 Teams (Red vs Blue)'}</option>
                  <option value={3}>{lang === 'ja' ? '👥 3チーム (3グループ)' : '👥 3 Teams'}</option>
                  <option value={4}>{lang === 'ja' ? '👥 4チーム (4グループ)' : '👥 4 Teams'}</option>
                  <option value={5}>{lang === 'ja' ? '👥 5チーム (5列 / 5班)' : '👥 5 Teams (5 Rows)'}</option>
                  <option value={6}>{lang === 'ja' ? '👥 6チーム (6列 / 6班)' : '👥 6 Teams (6 Rows)'}</option>
                </select>
              </div>

              <button onClick={() => setupDeck()} className="text-xs bg-indigo-50 dark:bg-slate-700 hover:bg-indigo-100 dark:hover:bg-slate-600 font-bold px-3 py-1.5 rounded-lg text-indigo-700 dark:text-indigo-200">
                {lang === 'ja' ? '🔄 リセット' : '🔄 Reset'}
              </button>
            </div>
          </div>

          {/* Sneak Peek Countdown Banner */}
          {peekCountdown !== null && (
            <div className="w-full bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600 text-white p-2.5 sm:p-3 rounded-2xl shadow-lg flex items-center justify-between animate-pulse">
              <div className="flex items-center gap-2 font-black text-sm sm:text-base">
                <span className="text-xl sm:text-2xl">👀</span>
                <span>
                  {lang === 'ja'
                    ? `チラ見せ中！ よく おぼえてね！ 残り: ${peekCountdown} 秒...`
                    : `Sneak Peek Active! Memorize the cards! Time remaining: ${peekCountdown}s...`}
                </span>
              </div>
              <button
                onClick={cancelSneakPeek}
                className="px-3 py-1 bg-white/20 hover:bg-white/30 text-white rounded-lg text-xs font-bold transition active:scale-95"
              >
                {lang === 'ja' ? '今すぐ とじる' : 'Close Peek'}
              </button>
            </div>
          )}

          {/* Team Scoreboard / Turn Indicator */}
          {teamCount > 1 ? (
            <div className="w-full bg-white/95 dark:bg-slate-800/95 backdrop-blur p-2.5 sm:p-3 rounded-2xl border-2 border-indigo-200 dark:border-slate-700 shadow flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-black uppercase text-gray-500 dark:text-slate-400">
                  {lang === 'ja' ? 'げんざいの ばん:' : 'Turn:'}
                </span>
                <div className={`px-3 py-1 rounded-xl font-black text-sm sm:text-base flex items-center gap-1.5 shadow-sm ring-2 ${currentTeam.ring} ${currentTeam.bgLight} ${currentTeam.text} animate-pulse`}>
                  <span>{currentTeam.badge}</span>
                  <span>{lang === 'ja' ? currentTeam.ja : currentTeam.en}</span>
                  {streak > 0 && (
                    <span className="ml-1 px-1.5 py-0.5 bg-amber-400 text-amber-950 rounded-md text-xs font-black animate-bounce">
                      🔥 {streak}連続！ {lang === 'ja' ? 'もう1回！' : 'Bonus Turn!'}
                    </span>
                  )}
                </div>
              </div>

              {/* Team Scores Bar */}
              <div className="flex items-center gap-1.5 sm:gap-2.5 flex-wrap">
                {MEMORY_TEAMS.slice(0, teamCount).map((team, tIdx) => {
                  const isCurrent = tIdx === activeTeamIndex;
                  return (
                    <div
                      key={team.id}
                      className={`flex items-center gap-1 px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-xl text-xs font-bold border transition ${
                        isCurrent
                          ? `${team.bgLight} ${team.border} ring-2 ${team.ring} shadow`
                          : 'bg-gray-50 dark:bg-slate-900/50 border-gray-200 dark:border-slate-700 opacity-80'
                      }`}
                    >
                      <span>{team.badge}</span>
                      <span className={team.text}>{lang === 'ja' ? team.ja.split(' ')[0] : team.name}:</span>
                      <span className="font-black text-gray-900 dark:text-white text-sm">{teamScores[tIdx] || 0}</span>
                      <span className="text-[10px] text-gray-500 dark:text-slate-400">{lang === 'ja' ? '組' : 'pairs'}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          ) : (
